<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilhas de Matemática</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --hub-bg:#12131a; --hub-bg2:#1b1d29; --hub-text:#f5f5f7; --hub-muted:#8b8d9b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--hub-bg); color:var(--hub-text);
    font-family:'Inter',sans-serif; min-height:100vh;
    transition:background .35s ease, color .35s ease;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px; width:100%;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 24px;}
  .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.1rem; letter-spacing:.02em; display:flex; align-items:center; gap:8px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,#ff6b6b,#64b5f6,#b4e600); display:inline-block;}
  .crumbs{font-size:.85rem; color:var(--hub-muted);}
  .crumbs a:hover{color:var(--hub-text);}

  /* ---------- HOME / HUB ---------- */
  .hero{padding:64px 24px 40px; text-align:center;}
  .hero h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(2rem,5vw,3.4rem); font-weight:700; letter-spacing:-0.01em;}
  .hero p{color:var(--hub-muted); max-width:520px; margin:14px auto 0; font-size:1.05rem; line-height:1.5;}
  .portals{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; padding:20px 24px 80px; max-width:1080px; margin:0 auto; width:100%;}
  @media (max-width:820px){ .portals{grid-template-columns:1fr;} }

  .portal{
    position:relative; overflow:hidden; padding:28px 24px 26px; cursor:pointer;
    display:flex; flex-direction:column; gap:10px; min-height:230px;
    transition:transform .25s ease, box-shadow .25s ease;
    border:1px solid rgba(255,255,255,.06);
  }
  .portal:hover{transform:translateY(-4px);}
  .portal .icone{font-size:2.1rem;}
  .portal h3{font-size:1.3rem;}
  .portal .sub{font-size:.8rem; opacity:.75; font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
  .portal p{font-size:.92rem; line-height:1.5; opacity:.85;}
  .portal .ir{margin-top:auto; font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:6px;}

  .portal-ef1{background:#fff8ed; color:#3d348b; border-radius:28px; font-family:'Nunito',sans-serif; box-shadow:0 10px 0 -4px rgba(255,201,60,.5);}
  .portal-ef1 h3{font-family:'Baloo 2',sans-serif; font-weight:700;}
  .portal-ef1 .blob{position:absolute; width:150px; height:150px; border-radius:50%; background:#ffe08a; opacity:.55; top:-60px; right:-50px;}
  .portal-ef1 .blob2{position:absolute; width:90px; height:90px; border-radius:50%; background:#a0e8ff; opacity:.5; bottom:-35px; left:-25px;}

  .portal-ef2{background:#f5f4ff; color:#14142b; border-radius:16px; font-family:'Inter',sans-serif; border:2px solid #14142b;}
  .portal-ef2 h3{font-family:'Space Grotesk',sans-serif;}
  .portal-ef2 .stripe{position:absolute; top:0; right:0; width:64px; height:100%; background:repeating-linear-gradient(-45deg,#5b5fef,#5b5fef 8px,#b4e600 8px,#b4e600 16px); opacity:.9;}

  .portal-em{background:#151924; color:#e8eaf0; border-radius:8px; font-family:'IBM Plex Sans',sans-serif;}
  .portal-em h3{font-family:'Sora',sans-serif;}
  .portal-em::before{content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(100,181,246,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(100,181,246,.07) 1px,transparent 1px); background-size:22px 22px; pointer-events:none;}

  .footer-note{text-align:center; padding:0 24px 50px; color:var(--hub-muted); font-size:.8rem;}

  /* ---------- THEMED PAGES ---------- */
  .page{flex:1; padding-bottom:70px;}
  .page-header{padding:36px 0 18px;}
  .level-tag{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.7;}
  .page-header h1{font-size:clamp(1.6rem,4vw,2.4rem); margin-top:6px;}
  .page-header p{margin-top:8px; max-width:640px; line-height:1.55; opacity:.85;}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; margin-top:26px;}
  .mod-card{padding:22px; display:flex; flex-direction:column; gap:8px; min-height:150px; cursor:pointer; transition:transform .2s ease;}
  .mod-card:hover{transform:translateY(-3px);}
  .mod-card .icone{font-size:1.6rem;}
  .mod-card h4{font-size:1.05rem;}
  .mod-card .count{font-size:.78rem; opacity:.65; margin-top:auto;}
  .mod-card.soon{opacity:.45; cursor:default;}
  .mod-card.soon:hover{transform:none;}
  .soon-tag{font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:99px; width:fit-content;}

  .lic-list{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
  .lic-row{display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; transition:transform .15s ease;}
  .lic-row:hover{transform:translateX(4px);}
  .lic-num{font-family:'IBM Plex Mono',monospace; font-size:.8rem; opacity:.6; width:26px;}
  .lic-row h4{font-size:1rem; flex:1;}
  .lic-arrow{opacity:.5;}

  .licao-body{max-width:720px; margin:0 auto; padding-top:10px;}
  .licao-section{margin-top:26px;}
  .licao-section h3{font-size:.85rem; text-transform:uppercase; letter-spacing:.07em; opacity:.65; margin-bottom:10px;}
  .licao-texto{line-height:1.7; font-size:1.02rem;}
  .exemplo-box{padding:18px 20px; border-radius:inherit;}
  .exemplo-step{display:flex; gap:10px; padding:6px 0; font-size:.95rem; line-height:1.5;}
  .exemplo-step b{opacity:.6; font-family:'IBM Plex Mono',monospace; font-size:.85rem;}
  .formula-box{padding:22px; text-align:center; font-size:1.15rem; overflow-x:auto;}

  /* THEME: EF1 */
  [data-theme="ef1"]{background:#fff8ed; color:#3d348b; font-family:'Nunito',sans-serif;}
  [data-theme="ef1"] h1,[data-theme="ef1"] h3,[data-theme="ef1"] h4{font-family:'Baloo 2',sans-serif;}
  [data-theme="ef1"] .mod-card,[data-theme="ef1"] .lic-row,[data-theme="ef1"] .exemplo-box,[data-theme="ef1"] .formula-box{background:#fff; border-radius:26px; box-shadow:0 6px 0 rgba(61,52,139,.08);}
  [data-theme="ef1"] .level-tag{color:#ff6b6b;}
  [data-theme="ef1"] .soon-tag{background:#ffe08a; color:#8a5a00;}
  [data-theme="ef1"] .lic-num{color:#ff6b6b;}
  [data-theme="ef1"] .btn-primary{background:#ff6b6b; color:#fff; border-radius:22px;}
  [data-theme="ef1"] .quiz-opt{background:#fff; border-radius:20px; border:2px solid #ffe3d1;}
  [data-theme="ef1"] .quiz-opt.correct{background:#06d6a0; color:#fff; border-color:#06d6a0;}
  [data-theme="ef1"] .quiz-opt.wrong{background:#ff6b6b; color:#fff; border-color:#ff6b6b;}
  [data-theme="ef1"] .badge{background:#ffc93c;}

  /* THEME: EF2 */
  [data-theme="ef2"]{background:#f5f4ff; color:#14142b; font-family:'Inter',sans-serif;}
  [data-theme="ef2"] h1,[data-theme="ef2"] h3,[data-theme="ef2"] h4{font-family:'Space Grotesk',sans-serif;}
  [data-theme="ef2"] .mod-card,[data-theme="ef2"] .lic-row,[data-theme="ef2"] .exemplo-box,[data-theme="ef2"] .formula-box{background:#fff; border-radius:14px; border:2px solid #14142b;}
  [data-theme="ef2"] .level-tag{color:#5b5fef;}
  [data-theme="ef2"] .soon-tag{background:#14142b; color:#b4e600;}
  [data-theme="ef2"] .lic-num{color:#5b5fef;}
  [data-theme="ef2"] .btn-primary{background:#5b5fef; color:#fff; border-radius:10px;}
  [data-theme="ef2"] .quiz-opt{background:#fff; border-radius:10px; border:2px solid #dcdcf5;}
  [data-theme="ef2"] .quiz-opt.correct{background:#b4e600; color:#14142b; border-color:#14142b;}
  [data-theme="ef2"] .quiz-opt.wrong{background:#ff5d5d; color:#fff; border-color:#ff5d5d;}
  [data-theme="ef2"] .badge{background:#5b5fef; color:#fff;}

  /* THEME: EM */
  [data-theme="em"]{background:#0b0e14; color:#e8eaf0; font-family:'IBM Plex Sans',sans-serif;}
  [data-theme="em"] h1,[data-theme="em"] h3,[data-theme="em"] h4{font-family:'Sora',sans-serif;}
  [data-theme="em"] .mod-card,[data-theme="em"] .lic-row,[data-theme="em"] .exemplo-box,[data-theme="em"] .formula-box{background:#151924; border-radius:8px; border:1px solid #232838;}
  [data-theme="em"] .level-tag{color:#64b5f6;}
  [data-theme="em"] .soon-tag{background:#232838; color:#8a93a8;}
  [data-theme="em"] .lic-num{color:#64b5f6;}
  [data-theme="em"] .btn-primary{background:#64b5f6; color:#0b0e14; border-radius:6px; font-weight:600;}
  [data-theme="em"] .quiz-opt{background:#151924; border-radius:6px; border:1px solid #2a3040; font-family:'IBM Plex Mono',monospace; font-size:.9rem;}
  [data-theme="em"] .quiz-opt.correct{background:rgba(100,181,246,.15); border-color:#64b5f6; color:#64b5f6;}
  [data-theme="em"] .quiz-opt.wrong{background:rgba(255,183,77,.12); border-color:#ffb74d; color:#ffb74d;}
  [data-theme="em"] .badge{background:#64b5f6; color:#0b0e14;}
  [data-theme="em"] .exemplo-step b{color:#64b5f6;}

  .btn-primary{padding:11px 22px; font-size:.9rem; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
  .btn-back{background:none; opacity:.7; font-size:.85rem; font-weight:600; padding:8px 0; display:inline-flex; align-items:center; gap:6px;}
  .btn-back:hover{opacity:1;}

  .quiz-card{margin-top:14px; padding:20px; border-radius:inherit;}
  .quiz-q{font-weight:700; margin-bottom:14px; font-size:1rem;}
  .quiz-opt{display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:9px; font-size:.92rem; transition:transform .1s ease;}
  .quiz-opt:hover:not(:disabled){transform:translateX(3px);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-feedback{margin-top:10px; font-size:.9rem; padding:12px 14px; border-radius:10px; opacity:0; max-height:0; overflow:hidden; transition:all .25s ease;}
  .quiz-feedback.show{opacity:1; max-height:200px; margin-top:12px;}
  .quiz-progress{display:flex; gap:6px; margin-top:16px;}
  .quiz-dot{width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.25;}
  .quiz-dot.done{opacity:1;}
  .quiz-done{padding:26px; text-align:center; border-radius:inherit; margin-top:14px;}
  .quiz-done .big{font-size:2.4rem;}

  .modulos-soon-list{margin-top:34px; opacity:.6;}
  .modulos-soon-list h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .soon-pills{display:flex; flex-wrap:wrap; gap:8px;}
  .soon-pills span{font-size:.8rem; padding:6px 12px; border-radius:99px; border:1px dashed currentColor; opacity:.7;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   DADOS — organizados como as coleções niveis / modulos / licoes
   (mesmo modelo que futuramente pode virar coleções no Firestore)
   ========================================================================= */
const DATA = {
  niveis: [
    { id:"ef1", titulo:"Ensino Fundamental 1", subtitulo:"1º ao 5º ano", tema:"ef1", icone:"🎒",
      descricao:"Alfabetização matemática, operações básicas e o primeiro contato com números, formas e medidas." },
    { id:"ef2", titulo:"Ensino Fundamental 2", subtitulo:"6º ao 9º ano", tema:"ef2", icone:"🧑‍🏫",
      descricao:"Mais abstração: números inteiros, álgebra inicial, proporções e geometria com ângulos e áreas." },
    { id:"em", titulo:"Ensino Médio", subtitulo:"1º ao 3º ano", tema:"em", icone:"🎓",
      descricao:"Funções, trigonometria, geometria analítica e estatística — a base para ENEM e vestibulares." }
  ],

  modulos: [
    { id:"ef1-numeracao", nivelId:"ef1", titulo:"Sistema de Numeração", icone:"🔢",
      descricao:"Leitura, escrita e comparação de números naturais." },
    { id:"ef1-operacoes", nivelId:"ef1", titulo:"Operações Básicas", icone:"➕",
      descricao:"Adição e subtração com números naturais." },

    { id:"ef2-algebra", nivelId:"ef2", titulo:"Álgebra Inicial", icone:"🧬",
      descricao:"Expressões algébricas e equações do 1º e 2º grau." },
    { id:"ef2-razoes", nivelId:"ef2", titulo:"Razões e Proporções", icone:"📈",
      descricao:"Porcentagem e regra de três." },

    { id:"em-funcoes", nivelId:"em", titulo:"Funções", icone:"📈",
      descricao:"Função afim e função quadrática." },
    { id:"em-trigonometria", nivelId:"em", titulo:"Trigonometria", icone:"📐",
      descricao:"Razões trigonométricas e lei dos senos." },

    { id:"ef1-fracoes", nivelId:"ef1", titulo:"Frações e Decimais", icone:"🍰",
      descricao:"Partes de um todo, metade, terça parte e dinheiro." },
    { id:"ef1-geometria", nivelId:"ef1", titulo:"Geometria Visual", icone:"📐",
      descricao:"Figuras planas, espaciais e simetria." },
    { id:"ef1-medidas", nivelId:"ef1", titulo:"Grandezas e Medidas", icone:"📏",
      descricao:"Tempo, comprimento, massa e capacidade." },
    { id:"ef1-graficos", nivelId:"ef1", titulo:"Gráficos Simples", icone:"📊",
      descricao:"Tabelas e gráficos de barras." },

    { id:"ef2-aritmetica", nivelId:"ef2", titulo:"Aritmética Avançada", icone:"🧮",
      descricao:"Números inteiros, potenciação e radiciação." },
    { id:"ef2-teoria-numeros", nivelId:"ef2", titulo:"Teoria dos Números", icone:"➗",
      descricao:"Divisibilidade, números primos, MMC e MDC." },
    { id:"ef2-geometria-triangulos", nivelId:"ef2", titulo:"Geometria e Triângulos", icone:"🔺",
      descricao:"Ângulos, polígonos e Teorema de Pitágoras." },
    { id:"ef2-areas-volumes", nivelId:"ef2", titulo:"Áreas e Volumes", icone:"🟫",
      descricao:"Perímetro, área e volume de sólidos simples." },
    { id:"ef2-estatistica", nivelId:"ef2", titulo:"Estatística e Chance", icone:"📊",
      descricao:"Média aritmética e probabilidade simples." },

    { id:"em-sequencias", nivelId:"em", titulo:"Sequências e Matrizes", icone:"🔢",
      descricao:"Progressão aritmética e determinantes." },
    { id:"em-geo-analitica", nivelId:"em", titulo:"Geometria Analítica", icone:"📍",
      descricao:"Distância entre pontos e equação da reta." },
    { id:"em-geo-espacial", nivelId:"em", titulo:"Geometria Espacial", icone:"📦",
      descricao:"Prismas, pirâmides, cilindros, cones e esferas." },
    { id:"em-combinatoria", nivelId:"em", titulo:"Análise Combinatória", icone:"🎲",
      descricao:"Fatorial, combinações e probabilidade condicional." },
    { id:"em-estat-avancada", nivelId:"em", titulo:"Estatística Avançada", icone:"📉",
      descricao:"Mediana, moda, variância e desvio padrão." }
  ],

  // módulos que aparecem na trilha mas ainda não têm lições publicadas
  modulosEmBreve: { ef1: [], ef2: [], em: [] },

  licoes: [
    // ---------- EF1 · Sistema de Numeração ----------
    { id:"ef1-numeracao-l1", moduloId:"ef1-numeracao", titulo:"Dezenas e Unidades",
      conteudoTexto:"Quando contamos além de 9, agrupamos os números em grupinhos de 10. Cada grupinho de 10 é uma dezena. Os números soltos que sobram são as unidades.",
      exemplo:[
        "Pegue o número 34.",
        "A casa da esquerda (3) mostra as dezenas: 3 grupos de 10 = 30.",
        "A casa da direita (4) mostra as unidades: 4 soltinhos.",
        "30 + 4 = 34 🎉"
      ],
      quiz:[
        { pergunta:"No número 47, quantas dezenas existem?", opcoes:["4","7","47"], correta:0, explicacao:"O 4 está na casa das dezenas — são 4 grupos de 10, ou seja, 40." },
        { pergunta:"Quantas unidades tem o número 52?", opcoes:["5","2","50"], correta:1, explicacao:"O 2 está na casa das unidades." }
      ]
    },
    { id:"ef1-numeracao-l2", moduloId:"ef1-numeracao", titulo:"Comparando Números",
      conteudoTexto:"Para saber qual número é maior, olhamos primeiro quantos algarismos ele tem. Se os dois têm a mesma quantidade, comparamos casa por casa, começando pela esquerda.",
      exemplo:[
        "Compare 58 e 61.",
        "Os dois têm 2 algarismos, então vamos comparar as dezenas.",
        "5 (de 58) é menor que 6 (de 61).",
        "Logo, 61 é o maior número."
      ],
      quiz:[
        { pergunta:"Qual número é maior: 29 ou 31?", opcoes:["29","31"], correta:1, explicacao:"Comparando as dezenas: 3 é maior que 2, então 31 > 29." },
        { pergunta:"Qual símbolo representa 'maior que'?", opcoes:[">","<","="], correta:0, explicacao:"O símbolo > sempre aponta para o número menor." }
      ]
    },

    // ---------- EF1 · Operações Básicas ----------
    { id:"ef1-operacoes-l1", moduloId:"ef1-operacoes", titulo:"Adição sem Mistério",
      conteudoTexto:"Somar é juntar duas quantidades. Quando a soma de uma casa passa de 9, a gente 'vai um' para a casa seguinte.",
      exemplo:[
        "Some 27 + 15.",
        "Unidades: 7 + 5 = 12 → escreve 2, vai 1 para as dezenas.",
        "Dezenas: 2 + 1 + 1(que veio) = 4.",
        "Resultado: 42."
      ],
      quiz:[
        { pergunta:"Quanto é 8 + 5?", opcoes:["12","13","14"], correta:1, explicacao:"8 + 5 = 13." },
        { pergunta:"No cálculo 27 + 15, quanto 'vai' para a casa das dezenas?", opcoes:["0","1","2"], correta:1, explicacao:"7+5=12, escreve 2 e vai 1." }
      ]
    },
    { id:"ef1-operacoes-l2", moduloId:"ef1-operacoes", titulo:"Subtração Passo a Passo",
      conteudoTexto:"Subtrair é tirar uma quantidade de outra. Quando o número de cima é menor que o de baixo, a gente 'empresta' 1 da casa vizinha.",
      exemplo:[
        "Calcule 42 - 15.",
        "Unidades: 2 é menor que 5, então empresta 1 da dezena → 12 - 5 = 7.",
        "Dezenas: 3 (4 emprestou 1) - 1 = 2.",
        "Resultado: 27."
      ],
      quiz:[
        { pergunta:"Quanto é 42 - 15?", opcoes:["27","26","37"], correta:0, explicacao:"42 - 15 = 27." },
        { pergunta:"Quando o número de cima é menor, o que fazemos?", opcoes:["Emprestamos da casa vizinha","Ignoramos e pulamos","Somamos os dois"], correta:0, explicacao:"Emprestar 1 da dezena vizinha resolve a conta." }
      ]
    },

    // ---------- EF1 · Frações e Decimais ----------
    { id:"ef1-fracoes-l1", moduloId:"ef1-fracoes", titulo:"Partes de um Todo",
      conteudoTexto:"Uma fração representa uma parte de um todo dividido em partes iguais. O número de baixo (denominador) diz em quantas partes o todo foi dividido; o de cima (numerador) diz quantas partes a gente pegou.",
      exemplo:[
        "Imagine uma pizza inteira.",
        "Ela é cortada em 4 pedaços iguais.",
        "Cada pedaço representa 1/4 da pizza.",
        "Se você come 1 pedaço, comeu 1/4 da pizza."
      ],
      quiz:[
        { pergunta:"Uma barra de chocolate tem 8 pedaços iguais. Se você come 2, que fração comeu?", opcoes:["2/8","8/2","2/6"], correta:0, explicacao:"2 pedaços de um total de 8 pedaços é 2/8." },
        { pergunta:"Na fração 3/5, o que o número 5 representa?", opcoes:["Quantas partes eu peguei","Em quantas partes o todo foi dividido"], correta:1, explicacao:"O denominador (embaixo) sempre mostra em quantas partes o todo foi repartido." }
      ]
    },
    { id:"ef1-fracoes-l2", moduloId:"ef1-fracoes", titulo:"Dinheiro: Metade e Terça Parte",
      conteudoTexto:"Usamos frações o tempo todo com dinheiro. A metade é dividir em 2 partes iguais (1/2). A terça parte é dividir em 3 partes iguais (1/3).",
      exemplo:[
        "Repartir R$10 entre 2 amigos.",
        "R$10 dividido em 2 partes iguais.",
        "Cada parte fica com R$5.",
        "R$5 é a metade (1/2) de R$10."
      ],

/* =========================================================================
   ESTADO E NAVEGAÇÃO (progresso fica só na memória da sessão)
   ========================================================================= */
const state = { quizProgress:{} };

function nivelById(id){ return DATA.niveis.find(n=>n.id===id); }
function modulosByNivel(id){ return DATA.modulos.filter(m=>m.nivelId===id); }
function licoesByModulo(id){ return DATA.licoes.filter(l=>l.moduloId===id); }
function licaoById(id){ return DATA.licoes.find(l=>l.id===id); }
function moduloById(id){ return DATA.modulos.find(m=>m.id===id); }

function navigate(hash){ location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  const app = document.getElementById("app");

  if(parts[0] === "nivel" && parts[1] && parts[2] === "modulo" && parts[3]){
    renderModulo(app, parts[1], parts[3]);
  } else if(parts[0] === "nivel" && parts[1]){
    renderNivel(app, parts[1]);
  } else if(parts[0] === "licao" && parts[1]){
    renderLicao(app, parts[1]);
  } else {
    renderHome(app);
  }
  window.scrollTo(0,0);
}

/* ---------- HOME ---------- */
function renderHome(app){
  document.body.removeAttribute("data-theme");
  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand"><span class="brand-dot"></span> Trilhas de Matemática</div>
    </div>
    <div class="hero">
      <h1>Uma trilha de matemática<br>para cada fase da vida</h1>
      <p>Do primeiro contato com os números até a véspera do vestibular — escolha sua etapa para começar.</p>
    </div>
    <div class="portals">
      ${DATA.niveis.map(n => `
        <div class="portal portal-${n.tema}" onclick="navigate('nivel/${n.id}')">
          ${n.tema==='ef1' ? '<div class="blob"></div><div class="blob2"></div>' : ''}
          ${n.tema==='ef2' ? '<div class="stripe"></div>' : ''}
          <div class="icone">${n.icone}</div>
          <div class="sub">${n.subtitulo}</div>
          <h3>${n.titulo}</h3>
          <p>${n.descricao}</p>
          <div class="ir">Entrar na trilha →</div>
        </div>
      `).join("")}
    </div>
    <div class="footer-note">Conteúdo baseado na BNCC.</div>
  `;
}

/* ---------- NÍVEL → lista de módulos ---------- */
function renderNivel(app, nivelId){
  const nivel = nivelById(nivelId);
  if(!nivel){ renderHome(app); return; }
  document.body.setAttribute("data-theme", nivel.tema);
  const mods = modulosByNivel(nivelId);
  const soon = DATA.modulosEmBreve[nivelId] || [];

  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand"><span class="brand-dot"></span> Trilhas de Matemática</div>
      <div class="crumbs"><a href="#/" onclick="navigate('/')">← todas as trilhas</a></div>
    </div>
    <div class="page wrap">
      <div class="page-header">
        <div class="level-tag">${nivel.subtitulo}</div>
        <h1>${nivel.icone} ${nivel.titulo}</h1>
        <p>${nivel.descricao}</p>
      </div>
      <div class="grid-cards">
        ${mods.map(m => `
          <div class="mod-card" onclick="navigate('nivel/${nivelId}/modulo/${m.id}')">
            <div class="icone">${m.icone}</div>
            <h4>${m.titulo}</h4>
            <div class="count">${licoesByModulo(m.id).length} lições</div>
          </div>
        `).join("")}
      </div>
      ${soon.length ? `
      <div class="modulos-soon-list">
        <h3>Em breve nesta trilha</h3>
        <div class="soon-pills">${soon.map(s=>`<span>${s}</span>`).join("")}</div>
      </div>` : ""}
    </div>
  `;
}

/* ---------- MÓDULO → lista de lições ---------- */
function renderModulo(app, nivelId, moduloId){
  const nivel = nivelById(nivelId);
  const modulo = moduloById(moduloId);
  if(!nivel || !modulo){ renderHome(app); return; }
  document.body.setAttribute("data-theme", nivel.tema);
  const lics = licoesByModulo(moduloId);

  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand"><span class="brand-dot"></span> Trilhas de Matemática</div>
      <div class="crumbs"><a onclick="navigate('nivel/${nivelId}')">← ${nivel.titulo}</a></div>
    </div>
    <div class="page wrap">
      <div class="page-header">
        <div class="level-tag">${modulo.icone} módulo</div>
        <h1>${modulo.titulo}</h1>
        <p>${modulo.descricao}</p>
      </div>
      <div class="lic-list">
        ${lics.map((l,i) => `
          <div class="lic-row" onclick="navigate('licao/${l.id}')">
            <div class="lic-num">${String(i+1).padStart(2,'0')}</div>
            <h4>${l.titulo}</h4>
            <div class="lic-arrow">→</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

/* ---------- LIÇÃO ---------- */

  const licao = licaoById(licaoId);
  if(!licao){ renderHome(app); return; }
  const modulo = moduloById(licao.moduloId);
  const nivel = nivelById(modulo.nivelId);
  document.body.setAttribute("data-theme", nivel.tema);

  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand"><span class="brand-dot"></span> Trilhas de Matemática</div>
      <div class="crumbs"><a onclick="navigate('nivel/${nivel.id}/modulo/${modulo.id}')">← ${modulo.titulo}</a></div>
    </div>
    <div class="page wrap">
      <div class="licao-body">
        <div class="level-tag">${nivel.titulo}</div>
        <h1 style="margin-top:6px;">${licao.titulo}</h1>

        <div class="licao-section">
          <h3>O que é</h3>
          <p class="licao-texto">${licao.conteudoTexto}</p>
        </div>

        ${licao.formulaLatex ? `
          <div class="licao-section">
            <h3>Fórmula</h3>
            <div class="formula-box" id="formula-${licao.id}"></div>
          </div>
        ` : ""}

        <div class="licao-section">
          <h3>Exemplo passo a passo</h3>
          <div class="exemplo-box">
            ${licao.exemplo.map((s,i)=>`<div class="exemplo-step"><b>${i+1}</b><span>${s}</span></div>`).join("")}
          </div>
        </div>

        <div class="licao-section" id="quiz-container">
          <h3>Vamos praticar?</h3>
          <div id="quiz-mount"></div>
        </div>
      </div>
    </div>
  `;

  if(licao.formulaLatex){
    katex.render(licao.formulaLatex, document.getElementById(`formula-${licao.id}`), { throwOnError:false, displayMode:true });
  }

  mountQuiz(licao);
}

/* ---------- QUIZ ---------- */
function mountQuiz(licao){
  let idx = 0;
  let acertos = 0;
  const mount = document.getElementById("quiz-mount");

  function draw(){
    if(idx >= licao.quiz.length){
      mount.innerHTML = `
        <div class="quiz-done">
          <div class="big">${acertos === licao.quiz.length ? '🏆' : '✅'}</div>
          <h4 style="margin-top:8px;">Você acertou ${acertos} de ${licao.quiz.length}</h4>
          <p style="opacity:.7; margin-top:6px; font-size:.9rem;">${acertos === licao.quiz.length ? 'Mandou muito bem!' : 'Continue praticando, você está no caminho certo.'}</p>
        </div>
      `;
      return;
    }
    const q = licao.quiz[idx];
    mount.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-q">${q.pergunta}</div>
        ${q.opcoes.map((op,i) => `<button class="quiz-opt" data-i="${i}">${op}</button>`).join("")}
        <div class="quiz-feedback" id="quiz-feedback"></div>
        <div class="quiz-progress">
          ${licao.quiz.map((_,i)=>`<div class="quiz-dot ${i<idx?'done':''}"></div>`).join("")}
        </div>
      </div>
    `;
    mount.querySelectorAll(".quiz-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosen = parseInt(btn.dataset.i, 10);
        const correct = chosen === q.correta;
        if(correct) acertos++;
        mount.querySelectorAll(".quiz-opt").forEach(b => {
          b.disabled = true;
          const bi = parseInt(b.dataset.i, 10);
          if(bi === q.correta) b.classList.add("correct");
          else if(bi === chosen) b.classList.add("wrong");
        });
        const fb = document.getElementById("quiz-feedback");
        fb.textContent = (correct ? "Isso mesmo! " : "Quase — ") + q.explicacao;
        fb.classList.add("show");

        const nextBtn = document.createElement("button");
        nextBtn.className = "btn-primary";
        nextBtn.style.marginTop = "14px";
        nextBtn.textContent = idx === licao.quiz.length - 1 ? "Ver resultado" : "Próxima pergunta →";
        nextBtn.onclick = () => { idx++; draw(); };
        mount.querySelector(".quiz-card").appendChild(nextBtn);
      }, { once:true });
    });
  }
  draw();
}
</script>
