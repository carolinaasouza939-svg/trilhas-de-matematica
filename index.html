<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilhas de Aprendizado</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --hub-bg:#12131a; --hub-bg2:#1b1d29; --hub-text:#f5f5f7; --hub-muted:#8b8d9b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--hub-bg); color:var(--hub-text);
    font-family:'Inter',sans-serif; min-height:100vh;
    transition:background .35s ease, color .35s ease;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px; width:100%;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 24px;}
  .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.1rem; letter-spacing:.02em; display:flex; align-items:center; gap:8px; cursor:pointer;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,#ff6b6b,#64b5f6,#b4e600); display:inline-block;}
  .crumbs{font-size:.85rem; color:var(--hub-muted);}
  .crumbs a:hover{color:var(--hub-text);}

  /* ---------- HOME / HUB ---------- */
  .hero{padding:64px 24px 40px; text-align:center;}
  .hero h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(2rem,5vw,3.4rem); font-weight:700; letter-spacing:-0.01em;}
  .hero p{color:var(--hub-muted); max-width:520px; margin:14px auto 0; font-size:1.05rem; line-height:1.5;}
  .portals{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; padding:20px 24px 80px; max-width:1080px; margin:0 auto; width:100%;}
  .portals.portals-2col{grid-template-columns:repeat(2,1fr); max-width:760px;}
  @media (max-width:820px){ .portals{grid-template-columns:1fr;} }

  .portal{
    position:relative; overflow:hidden; padding:28px 24px 26px; cursor:pointer;
    display:flex; flex-direction:column; gap:10px; min-height:230px;
    transition:transform .25s ease, box-shadow .25s ease;
    border:1px solid rgba(255,255,255,.06);
  }
  .portal:hover{transform:translateY(-4px);}
  .portal .icone{font-size:2.1rem;}
  .portal h3{font-size:1.3rem;}
  .portal .sub{font-size:.8rem; opacity:.75; font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
  .portal p{font-size:.92rem; line-height:1.5; opacity:.85;}
  .portal .ir{margin-top:auto; font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:6px;}

  .portal-ef1{background:#fff8ed; color:#3d348b; border-radius:28px; font-family:'Nunito',sans-serif; box-shadow:0 10px 0 -4px rgba(255,201,60,.5);}
  .portal-ef1 h3{font-family:'Baloo 2',sans-serif; font-weight:700;}
  .portal-ef1 .blob{position:absolute; width:150px; height:150px; border-radius:50%; background:#ffe08a; opacity:.55; top:-60px; right:-50px;}
  .portal-ef1 .blob2{position:absolute; width:90px; height:90px; border-radius:50%; background:#a0e8ff; opacity:.5; bottom:-35px; left:-25px;}

  .portal-ef2{background:#f5f4ff; color:#14142b; border-radius:16px; font-family:'Inter',sans-serif; border:2px solid #14142b;}
  .portal-ef2 h3{font-family:'Space Grotesk',sans-serif;}
  .portal-ef2 .stripe{position:absolute; top:0; right:0; width:64px; height:100%; background:repeating-linear-gradient(-45deg,#5b5fef,#5b5fef 8px,#b4e600 8px,#b4e600 16px); opacity:.9;}

  .portal-em{background:#151924; color:#e8eaf0; border-radius:8px; font-family:'IBM Plex Sans',sans-serif;}
  .portal-em h3{font-family:'Sora',sans-serif;}
  .portal-em::before{content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(100,181,246,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(100,181,246,.07) 1px,transparent 1px); background-size:22px 22px; pointer-events:none;}

  .portal-materia{background:var(--hub-bg2); border-radius:20px; font-family:'Inter',sans-serif; min-height:200px; justify-content:center; align-items:flex-start; text-align:left;}
  .portal-materia .icone{font-size:2.6rem;}
  .portal-materia h3{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; margin-top:4px;}
  .portal-materia.portal-matematica{border:1px solid rgba(100,181,246,.35);}
  .portal-materia.portal-matematica:hover{border-color:#64b5f6;}
  .portal-materia.portal-portugues{border:1px solid rgba(255,183,77,.35);}
  .portal-materia.portal-portugues:hover{border-color:#ffb74d;}

  .footer-note{text-align:center; padding:0 24px 50px; color:var(--hub-muted); font-size:.8rem;}

  /* ---------- THEMED PAGES ---------- */
  .page{flex:1; padding-bottom:70px;}
  .page-header{padding:36px 0 18px;}
  .level-tag{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.7;}
  .page-header h1{font-size:clamp(1.6rem,4vw,2.4rem); margin-top:6px;}
  .page-header p{margin-top:8px; max-width:640px; line-height:1.55; opacity:.85;}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; margin-top:26px;}
  .mod-card{padding:22px; display:flex; flex-direction:column; gap:8px; min-height:150px; cursor:pointer; transition:transform .2s ease;}
  .mod-card:hover{transform:translateY(-3px);}
  .mod-card .icone{font-size:1.6rem;}
  .mod-card h4{font-size:1.05rem;}
  .mod-card .count{font-size:.78rem; opacity:.65; margin-top:auto;}
  .mod-card.soon{opacity:.45; cursor:default;}
  .mod-card.soon:hover{transform:none;}
  .soon-tag{font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:99px; width:fit-content;}

  .lic-list{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
  .lic-row{display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; transition:transform .15s ease;}
  .lic-row:hover{transform:translateX(4px);}
  .lic-num{font-family:'IBM Plex Mono',monospace; font-size:.8rem; opacity:.6; width:26px;}
  .lic-row h4{font-size:1rem; flex:1;}
  .lic-arrow{opacity:.5;}

  .licao-body{max-width:720px; margin:0 auto; padding-top:10px;}
  .licao-section{margin-top:26px;}
  .licao-section h3{font-size:.85rem; text-transform:uppercase; letter-spacing:.07em; opacity:.65; margin-bottom:10px;}
  .licao-texto{line-height:1.7; font-size:1.02rem;}
  .exemplo-box{padding:18px 20px; border-radius:inherit;}
  .exemplo-step{display:flex; gap:10px; padding:6px 0; font-size:.95rem; line-height:1.5;}
  .exemplo-step b{opacity:.6; font-family:'IBM Plex Mono',monospace; font-size:.85rem;}
  .formula-box{padding:22px; text-align:center; font-size:1.15rem; overflow-x:auto;}

  /* THEME: EF1 */
  [data-theme="ef1"]{background:#fff8ed; color:#3d348b; font-family:'Nunito',sans-serif;}
  [data-theme="ef1"] h1,[data-theme="ef1"] h3,[data-theme="ef1"] h4{font-family:'Baloo 2',sans-serif;}
  [data-theme="ef1"] .mod-card,[data-theme="ef1"] .lic-row,[data-theme="ef1"] .exemplo-box,[data-theme="ef1"] .formula-box,[data-theme="ef1"] .figura-box{background:#fff; border-radius:26px; box-shadow:0 6px 0 rgba(61,52,139,.08);}
  [data-theme="ef1"] .level-tag{color:#ff6b6b;}
  [data-theme="ef1"] .soon-tag{background:#ffe08a; color:#8a5a00;}
  [data-theme="ef1"] .lic-num{color:#ff6b6b;}
  [data-theme="ef1"] .btn-primary{background:#ff6b6b; color:#fff; border-radius:22px;}
  [data-theme="ef1"] .quiz-opt{background:#fff; border-radius:20px; border:2px solid #ffe3d1;}
  [data-theme="ef1"] .quiz-opt.correct{background:#06d6a0; color:#fff; border-color:#06d6a0;}
  [data-theme="ef1"] .quiz-opt.wrong{background:#ff6b6b; color:#fff; border-color:#ff6b6b;}
  [data-theme="ef1"] .badge{background:#ffc93c;}

  /* THEME: EF2 */
  [data-theme="ef2"]{background:#f5f4ff; color:#14142b; font-family:'Inter',sans-serif;}
  [data-theme="ef2"] h1,[data-theme="ef2"] h3,[data-theme="ef2"] h4{font-family:'Space Grotesk',sans-serif;}
  [data-theme="ef2"] .mod-card,[data-theme="ef2"] .lic-row,[data-theme="ef2"] .exemplo-box,[data-theme="ef2"] .formula-box,[data-theme="ef2"] .figura-box{background:#fff; border-radius:14px; border:2px solid #14142b;}
  [data-theme="ef2"] .level-tag{color:#5b5fef;}
  [data-theme="ef2"] .soon-tag{background:#14142b; color:#b4e600;}
  [data-theme="ef2"] .lic-num{color:#5b5fef;}
  [data-theme="ef2"] .btn-primary{background:#5b5fef; color:#fff; border-radius:10px;}
  [data-theme="ef2"] .quiz-opt{background:#fff; border-radius:10px; border:2px solid #dcdcf5;}
  [data-theme="ef2"] .quiz-opt.correct{background:#b4e600; color:#14142b; border-color:#14142b;}
  [data-theme="ef2"] .quiz-opt.wrong{background:#ff5d5d; color:#fff; border-color:#ff5d5d;}
  [data-theme="ef2"] .badge{background:#5b5fef; color:#fff;}

  /* THEME: EM */
  [data-theme="em"]{background:#0b0e14; color:#e8eaf0; font-family:'IBM Plex Sans',sans-serif;}
  [data-theme="em"] h1,[data-theme="em"] h3,[data-theme="em"] h4{font-family:'Sora',sans-serif;}
  [data-theme="em"] .mod-card,[data-theme="em"] .lic-row,[data-theme="em"] .exemplo-box,[data-theme="em"] .formula-box,[data-theme="em"] .figura-box{background:#151924; border-radius:8px; border:1px solid #232838;}
  [data-theme="em"] .level-tag{color:#64b5f6;}
  [data-theme="em"] .soon-tag{background:#232838; color:#8a93a8;}
  [data-theme="em"] .lic-num{color:#64b5f6;}
  [data-theme="em"] .btn-primary{background:#64b5f6; color:#0b0e14; border-radius:6px; font-weight:600;}
  [data-theme="em"] .quiz-opt{background:#151924; border-radius:6px; border:1px solid #2a3040; font-family:'IBM Plex Mono',monospace; font-size:.9rem;}
  [data-theme="em"] .quiz-opt.correct{background:rgba(100,181,246,.15); border-color:#64b5f6; color:#64b5f6;}
  [data-theme="em"] .quiz-opt.wrong{background:rgba(255,183,77,.12); border-color:#ffb74d; color:#ffb74d;}
  [data-theme="em"] .badge{background:#64b5f6; color:#0b0e14;}
  [data-theme="em"] .exemplo-step b{color:#64b5f6;}

  .btn-primary{padding:11px 22px; font-size:.9rem; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
  .btn-back{background:none; opacity:.7; font-size:.85rem; font-weight:600; padding:8px 0; display:inline-flex; align-items:center; gap:6px;}
  .btn-back:hover{opacity:1;}

  .quiz-card{margin-top:14px; padding:20px; border-radius:inherit;}
  .quiz-q{font-weight:700; margin-bottom:14px; font-size:1rem;}
  .quiz-opt{display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:9px; font-size:.92rem; transition:transform .1s ease;}
  .quiz-opt:hover:not(:disabled){transform:translateX(3px);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-feedback{margin-top:10px; font-size:.9rem; padding:12px 14px; border-radius:10px; opacity:0; max-height:0; overflow:hidden; transition:all .25s ease;}
  .quiz-feedback.show{opacity:1; max-height:200px; margin-top:12px;}
  .quiz-progress{display:flex; gap:6px; margin-top:16px;}
  .quiz-dot{width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.25;}
  .quiz-dot.done{opacity:1;}
  .quiz-done{padding:26px; text-align:center; border-radius:inherit; margin-top:14px;}
  .quiz-done .big{font-size:2.4rem;}

  .modulos-soon-list{margin-top:34px; opacity:.6;}
  .modulos-soon-list h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .soon-pills{display:flex; flex-wrap:wrap; gap:8px;}
  .soon-pills span{font-size:.8rem; padding:6px 12px; border-radius:99px; border:1px dashed currentColor; opacity:.7;}

  /* ---------- BUSCA (home) ---------- */
  .search-wrap{max-width:520px; margin:0 auto; padding:0 24px 10px; position:relative;}
  .search-input{width:100%; padding:14px 18px; font-size:1rem; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:var(--hub-bg2); color:var(--hub-text); font-family:'Inter',sans-serif;}
  .search-input::placeholder{color:var(--hub-muted);}
  .search-input:focus{outline:2px solid #64b5f6;}
  .search-results{max-width:520px; margin:10px auto 0; padding:0 24px;}
  .search-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:var(--hub-bg2); margin-bottom:8px; cursor:pointer; transition:transform .15s ease;}
  .search-item:hover{transform:translateX(3px);}
  .search-item .si-icon{font-size:1.2rem;}
  .search-item .si-text{flex:1;}
  .search-item .si-title{font-size:.92rem; font-weight:600;}
  .search-item .si-path{font-size:.75rem; color:var(--hub-muted); margin-top:2px;}
  .search-empty{text-align:center; color:var(--hub-muted); font-size:.85rem; padding:10px 0;}

  /* ---------- PROGRESSO ---------- */
  .progress-summary{display:flex; align-items:center; gap:12px; margin-top:18px; font-size:.85rem; opacity:.85;}
  .progress-bar-outer{flex:1; max-width:220px; height:8px; border-radius:99px; background:rgba(120,120,140,.2); overflow:hidden;}
  .progress-bar-inner{height:100%; border-radius:99px; background:currentColor; transition:width .3s ease;}
  .mod-card .mini-progress{margin-top:auto;}
  .mod-card .mini-bar-outer{height:5px; border-radius:99px; background:rgba(120,120,140,.2); overflow:hidden; margin-top:6px;}
  .mod-card .mini-bar-inner{height:100%; border-radius:99px; background:currentColor;}
  .lic-check{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; flex-shrink:0; background:currentColor; color:var(--hub-bg,#fff);}
  [data-theme] .lic-check.done{background:#06d6a0; color:#fff;}
  [data-theme="em"] .lic-check.done{background:#64b5f6; color:#0b0e14;}

  /* ---------- BOTÃO REVISÃO ---------- */
  .btn-revisao{display:inline-flex; align-items:center; gap:6px; padding:9px 18px; font-size:.85rem; font-weight:700; border-radius:99px; margin-top:16px; border:1px dashed currentColor; background:none; color:inherit; opacity:.85;}
  .btn-revisao:hover{opacity:1;}

  /* ---------- QUESTÃO ABERTA ---------- */
  .quiz-input-row{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .quiz-input{flex:1; min-width:160px; padding:11px 14px; font-size:.92rem; border-radius:10px; border:1px solid rgba(120,120,140,.35); background:transparent; color:inherit; font-family:inherit;}
  .quiz-input:focus{outline:2px solid currentColor;}
  .quiz-tag-aberta{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.55; margin-bottom:8px;}
  .quiz-tag-desafio{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; color:#ffb74d; opacity:.9;}

  .figura-box{padding:16px; border-radius:inherit; display:flex; justify-content:center;}
  .figura-box svg{max-width:340px;}

  /* ---------- REVISÃO RÁPIDA ---------- */
  .revisao-intro{padding:22px; border-radius:inherit; margin-top:18px;}
  .revisao-summary-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; margin-top:8px; cursor:pointer;}
  .revisao-summary-item:hover{transform:translateX(3px);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   DADOS — organizados como as coleções niveis / modulos / licoes
   (mesmo modelo que futuramente pode virar coleções no Firestore)

      conteudoTexto:"Um número é divisível por outro quando a divisão dá resto zero. Existem critérios que facilitam descobrir isso sem dividir — por exemplo, todo número par é divisível por 2. Números primos são aqueles que só podem ser divididos por 1 e por eles mesmos, como 2, 3, 5, 7, 11.",

    { id:"ef2-teoria-l2", moduloId:"ef2-teoria-numeros", titulo:"MMC e MDC",

      exemplo:[

        "MDC entre 12 e 18: divisores comuns são 1,2,3,6 → o maior é 6.",
        "Pela fatoração em escada (veja a figura): dividindo 8 e 12 por primos em comum até chegar a 1 e 1 dá o MMC; parando quando não há mais divisor comum dá o MDC."

      quiz:[

        { pergunta:"No 'meio' da história, geralmente acontece:", opcoes:["A apresentação dos personagens","O problema ou acontecimento principal","O fechamento da história"], correta:1, explicacao:"É no meio que o conflito ou desafio da história se desenrola." }
      ]
    },

    // ---------- PT · EF2 · Classes de Palavras ----------
    { id:"pt-ef2-classes-l1", moduloId:"pt-ef2-classes-palavras", titulo:"Substantivos: Próprios, Comuns e Coletivos",
      conteudoTexto:"Substantivo próprio nomeia algo específico, sempre com letra maiúscula (como 'Brasil'). Substantivo comum nomeia de forma geral (como 'país'). Substantivo coletivo nomeia um grupo (como 'cardume', grupo de peixes).",
      exemplo:[
        "'Maria' é próprio.",
        "'Menina' é comum.",
        "'Turma' é coletivo (grupo de alunos)."
      ],
      quiz:[
        { pergunta:"Qual destes é um substantivo próprio?", opcoes:["cidade","São Paulo","lugar"], correta:1, explicacao:"São Paulo nomeia um lugar específico, por isso é próprio e com maiúscula." },
        { pergunta:"'Cardume' é um substantivo:", opcoes:["Próprio","Comum","Coletivo"], correta:2, explicacao:"Cardume nomeia um grupo de peixes — é coletivo." }
      ]
    },
    { id:"pt-ef2-classes-l2", moduloId:"pt-ef2-classes-palavras", titulo:"Verbos: Tempo e Modo",
      conteudoTexto:"O verbo muda de forma para indicar o tempo (passado, presente, futuro) e o modo da ação.",
      exemplo:[
        "'Eu ANDEI' — passado.",
        "'Eu ANDO' — presente.",
        "'Eu ANDAREI' — futuro. Mesmo verbo, tempos diferentes."
      ],
      quiz:[
        { pergunta:"'Eu estudarei' está em qual tempo verbal?", opcoes:["Passado","Presente","Futuro"], correta:2, explicacao:"A terminação '-arei' indica ação futura." },
        { pergunta:"O verbo muda de forma principalmente para indicar:", opcoes:["A cor da frase","Tempo e modo da ação","O tamanho da palavra"], correta:1, explicacao:"Essas são as principais informações que a conjugação verbal transmite." }
      ]
    },

    // ---------- PT · EF2 · Sujeito e Predicado ----------
    { id:"pt-ef2-sintaxe-l1", moduloId:"pt-ef2-sintaxe", titulo:"Sujeito e Predicado",
      conteudoTexto:"Toda oração pode ser dividida em sujeito (quem pratica ou sofre a ação) e predicado (tudo que se diz sobre o sujeito, geralmente com o verbo).",
      exemplo:[
        "'O MENINO chutou a bola.'",
        "O MENINO é o sujeito.",
        "'chutou a bola' é o predicado."
      ],
      quiz:[
        { pergunta:"Na frase 'A professora explicou a lição', qual é o sujeito?", opcoes:["A professora","Explicou","A lição"], correta:0, explicacao:"'A professora' é quem pratica a ação." },
        { pergunta:"O predicado de uma oração geralmente contém:", opcoes:["Só substantivos","O verbo e o que se diz sobre o sujeito","Apenas adjetivos"], correta:1, explicacao:"O predicado é construído em torno do verbo." }
      ]
    },
    { id:"pt-ef2-sintaxe-l2", moduloId:"pt-ef2-sintaxe", titulo:"Frase, Oração e Período",
      conteudoTexto:"Frase é qualquer enunciado com sentido completo. Oração é a estrutura organizada em torno de um verbo. Período é uma frase formada por uma ou mais orações.",
      exemplo:[
        "'Socorro!' é uma frase sem verbo.",
        "'Ele correu.' é uma oração (tem verbo).",
        "'Ele correu porque estava com medo.' é um período com duas orações."
      ],
      quiz:[
        { pergunta:"Toda oração precisa ter:", opcoes:["Um verbo","Um adjetivo","Uma vírgula"], correta:0, explicacao:"É o verbo que organiza a estrutura de uma oração." },
        { pergunta:"Um período pode ser formado por:", opcoes:["Só uma palavra","Uma ou mais orações","Apenas números"], correta:1, explicacao:"Período é a frase organizada em uma ou mais orações." }
      ]
    },

    // ---------- PT · EF2 · Ortografia ----------
    { id:"pt-ef2-ortografia-l1", moduloId:"pt-ef2-ortografia", titulo:"X ou CH?",
      conteudoTexto:"Não existe uma regra fixa para todos os casos, mas algumas dicas ajudam: depois de ditongos, geralmente usamos X (como em 'caixa'); em palavras derivadas de outras com CH, mantemos o CH (como 'encharcar', de 'charco').",
      exemplo:[
        "'Caixa' usa X, porque vem depois do ditongo AI.",
        "'Encharcar' mantém o CH porque vem de 'charco'."
      ],
      quiz:[
        { pergunta:"Depois de um ditongo (como AI), geralmente usamos:", opcoes:["X","CH","Nenhum dos dois"], correta:0, explicacao:"Ex: caixa, peixe, frouxo." },
        { pergunta:"'Charco' dá origem a 'encharcar', mantendo:", opcoes:["O X","O CH","Nenhuma letra"], correta:1, explicacao:"Palavras derivadas mantêm a grafia da palavra de origem." }
      ]
    },
    { id:"pt-ef2-ortografia-l2", moduloId:"pt-ef2-ortografia", titulo:"Por Que ou Porque?",
      conteudoTexto:"'Por que' (separado, sem acento) é usado em perguntas. 'Porque' (junto) é usado para dar uma explicação ou motivo, geralmente em respostas.",
      exemplo:[
        "'Por que você chegou atrasado?' — pergunta.",
        "'Cheguei atrasado porque perdi o ônibus.' — explicação."
      ],
      quiz:[
        { pergunta:"Em perguntas, usamos:", opcoes:["Porque","Por que","Porquê"], correta:1, explicacao:"'Por que' separado é usado para perguntar." },
        { pergunta:"Para dar uma explicação numa resposta, usamos:", opcoes:["Por que","Porque","Por quê"], correta:1, explicacao:"'Porque' junto explica um motivo." }
      ]
    },

    // ---------- PT · EF2 · Concordância Verbal e Nominal ----------
    { id:"pt-ef2-concordancia-l1", moduloId:"pt-ef2-concordancia", titulo:"Concordância Nominal",
      conteudoTexto:"Concordância nominal é o ajuste entre substantivo, artigo e adjetivo em gênero (masculino/feminino) e número (singular/plural).",
      exemplo:[
        "'As casas brancas.'",
        "Todos no feminino plural: AS, CASAS, BRANCAS."
      ],
      quiz:[
        { pergunta:"Na frase 'O menino esperto', o adjetivo 'esperto' concorda em:", opcoes:["Gênero e número com 'menino'","Só em número","Não precisa concordar"], correta:0, explicacao:"Adjetivo concorda em gênero e número com o substantivo." },
        { pergunta:"'As flor bonita' está com a concordância:", opcoes:["Correta","Errada — deveria ser 'As flores bonitas'"], correta:1, explicacao:"Artigo, substantivo e adjetivo devem concordar no plural." }
      ]
    },
    { id:"pt-ef2-concordancia-l2", moduloId:"pt-ef2-concordancia", titulo:"Concordância Verbal",
      conteudoTexto:"Concordância verbal é o ajuste entre o sujeito e o verbo em número (singular/plural) e pessoa.",
      exemplo:[
        "'O aluno estuda.' — singular.",
        "'Os alunos estudam.' — plural. O verbo muda conforme o sujeito."
      ],
      quiz:[
        { pergunta:"Se o sujeito é plural, o verbo geralmente fica:", opcoes:["No singular","No plural","Sem verbo"], correta:1, explicacao:"O verbo concorda em número com o sujeito." },
        { pergunta:"'Os meninos brincou no parque' está:", opcoes:["Correto","Errado — deveria ser 'brincaram'"], correta:1, explicacao:"O sujeito plural exige o verbo também no plural." }
      ]
    },

    // ---------- PT · EF2 · Gêneros Textuais ----------
    { id:"pt-ef2-generos-l1", moduloId:"pt-ef2-generos-textuais", titulo:"O que são Gêneros Textuais",
      conteudoTexto:"Gênero textual é o 'tipo' de texto, com uma estrutura e objetivo próprios — como notícia, receita, carta ou história em quadrinhos.",
      exemplo:[
        "Uma receita tem lista de ingredientes e modo de preparo.",
        "Uma notícia conta um fato recente com data e local."
      ],
      quiz:[
        { pergunta:"Uma receita culinária é um exemplo de:", opcoes:["Gênero textual","Substantivo","Verbo"], correta:0, explicacao:"A receita é um gênero textual com estrutura própria." },
        { pergunta:"O que diferencia uma notícia de um poema?", opcoes:["A estrutura e o objetivo de cada gênero","Nada, são iguais","Só o tamanho da letra"], correta:0, explicacao:"Cada gênero tem finalidade e forma diferentes." }
      ]
    },
    { id:"pt-ef2-generos-l2", moduloId:"pt-ef2-generos-textuais", titulo:"Identificando a Finalidade de um Texto",
      conteudoTexto:"Cada texto tem uma finalidade: informar, convencer, emocionar, ensinar ou divertir. Reconhecer essa finalidade ajuda a interpretar melhor o texto.",
      exemplo:[
        "Um anúncio publicitário quer convencer você a comprar algo.",
        "Uma bula de remédio quer informar como usá-lo."
      ],
      quiz:[
        { pergunta:"Qual a finalidade principal de um anúncio publicitário?", opcoes:["Convencer a comprar","Só informar dados científicos","Contar uma história de terror"], correta:0, explicacao:"Anúncios têm finalidade persuasiva." },
        { pergunta:"Uma bula de remédio tem como finalidade principal:", opcoes:["Divertir o leitor","Informar como usar o remédio","Vender um produto qualquer"], correta:1, explicacao:"A bula é um gênero informativo." }
      ]
    },

    // ---------- PT · EF2 · Figuras de Linguagem ----------
    { id:"pt-ef2-figuras-l1", moduloId:"pt-ef2-figuras-linguagem", titulo:"Metáfora e Comparação",
      conteudoTexto:"Comparação usa uma palavra de ligação (como 'como') para comparar duas coisas. Metáfora compara sem essa palavra, como se uma coisa realmente fosse a outra.",
      exemplo:[
        "'Ele é como um leão' — comparação.",
        "'Ele é um leão' — metáfora."
      ],
      quiz:[
        { pergunta:"'Ela é como uma estrela' é um exemplo de:", opcoes:["Metáfora","Comparação","Nenhuma figura"], correta:1, explicacao:"O uso de 'como' caracteriza a comparação." },
        { pergunta:"Na metáfora, a ligação entre as duas coisas comparadas é feita:", opcoes:["Com a palavra 'como'","Sem palavra de ligação, como se fossem a mesma coisa","Sempre com números"], correta:1, explicacao:"A metáfora funde as duas ideias sem conectivo." }
      ]
    },
    { id:"pt-ef2-figuras-l2", moduloId:"pt-ef2-figuras-linguagem", titulo:"Hipérbole e Personificação",
      conteudoTexto:"Hipérbole é um exagero proposital para dar ênfase. Personificação é dar características humanas a seres que não são humanos.",
      exemplo:[
        "'Já te falei mil vezes!' — hipérbole (exagero).",
        "'O vento sussurrava segredos.' — personificação (o vento 'sussurra' como uma pessoa)."
      ],
      quiz:[
        { pergunta:"'Chorei rios de lágrimas' é um exemplo de:", opcoes:["Hipérbole","Personificação","Nenhuma figura"], correta:0, explicacao:"É um exagero proposital para dar ênfase à emoção." },
        { pergunta:"Dar características humanas a um objeto ou animal é chamado de:", opcoes:["Hipérbole","Personificação","Comparação"], correta:1, explicacao:"Personificação humaniza seres não-humanos." }
      ]
    },

    // ---------- PT · EM · Escolas Literárias ----------
    { id:"pt-em-literatura-l1", moduloId:"pt-em-literatura", titulo:"O que são Escolas Literárias",
      conteudoTexto:"Escolas literárias (ou estilos de época) são períodos da história da literatura com características e ideias em comum, como o Romantismo (emoção e idealização) e o Realismo (crítica social e objetividade).",
      exemplo:[
        "No Romantismo, os autores idealizavam o amor e a natureza.",
        "No Realismo, os autores criticavam a sociedade de forma mais objetiva.",
        "Já o Arcadismo, período anterior ao Romantismo, valorizava a vida simples no campo (bucolismo), em oposição à vida na corte."
      ],
      quiz:[
        { pergunta:"O Romantismo é marcado principalmente por:", opcoes:["Idealização e emoção","Crítica social objetiva","Apenas poesia sem sentimento"], correta:0, explicacao:"O Romantismo valoriza a emoção, o amor idealizado e a natureza." },
        { pergunta:"O Realismo, em contraste com o Romantismo, tende a ser:", opcoes:["Mais idealizado","Mais crítico e objetivo","Sem nenhuma crítica social"], correta:1, explicacao:"O Realismo busca retratar a sociedade de forma crítica e objetiva." },
        { pergunta:"Uma obra que idealiza o amor impossível e valoriza sentimentos exagerados provavelmente pertence a qual escola literária?", opcoes:["Romantismo","Realismo","Parnasianismo"], correta:0, explicacao:"A idealização do amor e da emoção é marca registrada do Romantismo.", dificuldade:"dificil" }
      ]
    },
    { id:"pt-em-literatura-l2", moduloId:"pt-em-literatura", titulo:"Modernismo Brasileiro",
      conteudoTexto:"O Modernismo no Brasil começou oficialmente com a Semana de Arte Moderna de 1922, trazendo uma linguagem mais livre, valorização da cultura brasileira e ruptura com padrões tradicionais.",
      exemplo:[
        "Autores modernistas experimentaram uma linguagem mais próxima da fala popular brasileira.",
        "Houve valorização de temas e cenários nacionais.",
        "O Modernismo brasileiro costuma ser dividido em três fases: a primeira (ruptura, anos 1920), a segunda (regionalismo social, anos 1930) e a terceira (pós-1945, com autores como Guimarães Rosa)."
      ],
      quiz:[
        { pergunta:"O Modernismo brasileiro começou oficialmente em qual evento?", opcoes:["Semana de Arte Moderna de 1922","Independência do Brasil","Proclamação da República"], correta:0, explicacao:"A Semana de 1922, em São Paulo, marcou o início oficial do movimento." },
        { pergunta:"Uma característica do Modernismo é:", opcoes:["Linguagem rígida e tradicional","Linguagem mais livre e valorização da cultura brasileira","Apenas imitar estilos europeus"], correta:1, explicacao:"O Modernismo rompeu com padrões rígidos anteriores." },
        { pergunta:"Uma obra que mistura crítica social com linguagem regional, publicada nos anos 1930, provavelmente pertence a qual fase do Modernismo?", opcoes:["Primeira fase","Segunda fase","Terceira fase"], correta:1, explicacao:"A segunda fase do Modernismo é marcada pelo regionalismo e pela crítica social.", dificuldade:"dificil" }
      ]
    },

    // ---------- PT · EM · Redação (ENEM) ----------
    { id:"pt-em-redacao-l1", moduloId:"pt-em-redacao", titulo:"Estrutura da Redação Dissertativo-Argumentativa",
      conteudoTexto:"Esse tipo de redação (cobrado no ENEM) tem estrutura: introdução (apresenta o tema e a tese), desenvolvimento (argumentos que sustentam a tese) e conclusão (retoma a ideia e propõe uma solução).",
      exemplo:[
        "Introdução: apresenta o problema e a tese.",
        "Desenvolvimento: 2 parágrafos com argumentos diferentes.",
        "Conclusão: propõe uma solução prática.",
        "Um erro comum é confundir introdução com resumo do texto motivador — a introdução deve apresentar sua própria tese, não apenas repetir os textos de apoio."
      ],
      quiz:[
        { pergunta:"A redação dissertativo-argumentativa tem quantas partes principais?", opcoes:["2","3","5"], correta:1, explicacao:"Introdução, desenvolvimento e conclusão." },
        { pergunta:"Na conclusão desse tipo de redação, é esperado:", opcoes:["Repetir a introdução igualzinha","Propor uma solução para o problema","Não concluir nada"], correta:1, explicacao:"A conclusão deve trazer uma proposta que resolva o problema discutido." },
        { pergunta:"Num parágrafo de desenvolvimento, o que geralmente vem logo após a apresentação do argumento?", opcoes:["Uma nova tese","Um exemplo ou dado que sustente o argumento","A proposta de intervenção"], correta:1, explicacao:"O argumento precisa ser sustentado por exemplos, dados ou repertório sociocultural.", dificuldade:"dificil" }
      ]
    },
    { id:"pt-em-redacao-l2", moduloId:"pt-em-redacao", titulo:"Proposta de Intervenção (ENEM)",
      conteudoTexto:"No ENEM, a conclusão da redação deve trazer uma proposta de intervenção detalhada: quem vai agir, o que vai fazer, como e com que finalidade, buscando resolver o problema discutido.",
      exemplo:[
        "'O Ministério da Educação (quem) deveria criar campanhas informativas (o quê) nas escolas (como) para reduzir o problema discutido (finalidade).'",
        "Propostas de intervenção muito genéricas, como 'a população deveria se conscientizar', tendem a perder pontos por falta de detalhamento."
      ],
      quiz:[
        { pergunta:"A proposta de intervenção do ENEM deve aparecer:", opcoes:["No início do texto","Na conclusão","Não é necessária"], correta:1, explicacao:"É na conclusão que a proposta de solução é apresentada." },
        { pergunta:"Uma boa proposta de intervenção deve indicar:", opcoes:["Só um agente, sem detalhes","Quem, o quê, como e para quê","Apenas uma opinião pessoal"], correta:1, explicacao:"Esses são os elementos que a banca do ENEM espera encontrar." },
        { pergunta:"Qual das opções abaixo é uma proposta de intervenção mais completa?", opcoes:["'As pessoas deveriam ser mais conscientes.'","'O governo deveria fazer algo a respeito.'","'O Ministério da Saúde deveria criar campanhas nas escolas, por meio de palestras, para reduzir o problema.'"], correta:2, explicacao:"Essa opção detalha quem age, o que faz e como — os elementos que a banca do ENEM espera.", dificuldade:"dificil" }
      ]
    },

    // ---------- PT · EM · Período Composto ----------
    { id:"pt-em-sintaxe-l1", moduloId:"pt-em-sintaxe-avancada", titulo:"Orações Coordenadas",
      conteudoTexto:"Orações coordenadas são independentes entre si (nenhuma 'depende' gramaticalmente da outra), mas podem estar ligadas por conjunções como 'e', 'mas', 'ou'.",
      exemplo:[
        "'Ele estudou e passou na prova.'",
        "As duas orações são independentes, ligadas por 'e'.",
        "Existem 5 tipos de orações coordenadas: aditivas (e), adversativas (mas), alternativas (ou), conclusivas (logo) e explicativas (pois)."
      ],
      quiz:[
        { pergunta:"Orações coordenadas são caracterizadas por serem:", opcoes:["Dependentes uma da outra","Independentes entre si","Sempre sem verbo"], correta:1, explicacao:"Cada oração coordenada tem sentido completo por si só." },
        { pergunta:"'Estudei, mas não passei' tem as orações ligadas por qual conjunção?", opcoes:["e","mas","porque"], correta:1, explicacao:"'Mas' liga as duas orações, indicando oposição." },
        { pergunta:"Na frase 'Estude bastante, pois a prova será difícil', a oração destacada é:", opcoes:["Aditiva","Explicativa","Alternativa"], correta:1, explicacao:"A conjunção 'pois' introduz uma explicação/justificativa.", dificuldade:"dificil" }
      ]
    },
    { id:"pt-em-sintaxe-l2", moduloId:"pt-em-sintaxe-avancada", titulo:"Orações Subordinadas",
      conteudoTexto:"Orações subordinadas dependem de uma oração principal para ter sentido completo — funcionam como um termo dela.",
      exemplo:[
        "'Espero QUE VOCÊ VENÇA.'",
        "A oração 'que você vença' depende de 'Espero' para fazer sentido completo.",
        "Orações subordinadas substantivas funcionam como um substantivo dentro da oração principal, como em 'Percebi QUE ELE MENTIU', que exerce a função de objeto direto."
      ],
      quiz:[
        { pergunta:"Uma oração subordinada:", opcoes:["Tem sentido completo sozinha","Depende de outra oração para ter sentido completo","Nunca tem verbo"], correta:1, explicacao:"Ela funciona como parte da oração principal." },
        { pergunta:"Na frase 'Espero que você vença', qual é a oração principal?", opcoes:["Espero","Que você vença","As duas juntas são a principal"], correta:0, explicacao:"'Espero' é a oração da qual a outra depende." },
        { pergunta:"Na frase 'É importante que você estude', a oração 'que você estude' funciona como:", opcoes:["Sujeito da oração principal","Objeto direto","Adjetivo"], correta:0, explicacao:"A oração subordinada substantiva subjetiva funciona como sujeito de 'é importante'.", dificuldade:"dificil" }
      ]
    },

    // ---------- PT · EM · Semântica ----------
    { id:"pt-em-semantica-l1", moduloId:"pt-em-semantica", titulo:"Sinônimos, Antônimos e Ambiguidade",
      conteudoTexto:"Sinônimos são palavras com significado parecido; antônimos têm significado oposto. Ambiguidade é quando uma frase pode ter mais de um sentido.",
      exemplo:[
        "'Feliz' e 'contente' são sinônimos.",
        "'Feliz' e 'triste' são antônimos.",
        "'Vi o rapaz com o binóculo' é ambígua: quem tinha o binóculo?",
        "Um caso famoso de ambiguidade: 'A polícia prendeu o ladrão em sua casa' — de quem é a casa, do ladrão ou da polícia?"
      ],
      quiz:[
        { pergunta:"'Grande' e 'enorme' são exemplos de:", opcoes:["Sinônimos","Antônimos","Ambiguidade"], correta:0, explicacao:"Têm significados muito próximos." },
        { pergunta:"Uma frase ambígua é aquela que:", opcoes:["Tem apenas um sentido claro","Pode ser entendida de mais de uma forma","Não tem verbo"], correta:1, explicacao:"A ambiguidade gera mais de uma interpretação possível." },
        { pergunta:"Qual frase abaixo é ambígua?", opcoes:["'Maria viu o cachorro correndo.'","'João comprou um carro novo ontem.'","'O professor corrigiu as provas rapidamente.'"], correta:0, explicacao:"Não fica claro quem estava correndo: Maria ou o cachorro.", dificuldade:"dificil" }
      ]
    },
    { id:"pt-em-semantica-l2", moduloId:"pt-em-semantica", titulo:"Ironia e Eufemismo",
      conteudoTexto:"Ironia é dizer o contrário do que se pensa, geralmente com tom crítico ou de humor. Eufemismo é suavizar uma ideia desagradável, dizendo de um jeito mais ameno.",
      exemplo:[
        "'Que dia lindo!' dito durante uma tempestade — ironia.",
        "'Ele partiu desta vida' — eufemismo para 'ele morreu'.",
        "O eufemismo também é usado em contextos profissionais, como dizer 'colaborador foi desligado' em vez de 'foi demitido'."
      ],
      quiz:[
        { pergunta:"Dizer 'Que ótimo!' de forma sarcástica durante um problema é um exemplo de:", opcoes:["Ironia","Eufemismo","Hipérbole"], correta:0, explicacao:"A ironia diz o oposto do que realmente se pensa." },
        { pergunta:"Eufemismo serve para:", opcoes:["Exagerar uma ideia","Suavizar uma ideia desagradável","Comparar duas coisas"], correta:1, explicacao:"O eufemismo torna uma ideia dura mais amena." },
        { pergunta:"'Ele foi convidado a se retirar da empresa' é um exemplo de:", opcoes:["Ironia","Eufemismo","Hipérbole"], correta:1, explicacao:"A frase suaviza a ideia de demissão.", dificuldade:"dificil" }
      ]
    },

    // ---------- PT · EM · Interpretação Avançada ----------
    { id:"pt-em-interpretacao-l1", moduloId:"pt-em-interpretacao-avancada", titulo:"Identificando a Tese de um Texto",
      conteudoTexto:"Em textos argumentativos, a tese é a ideia central que o autor defende. Identificá-la é essencial para entender o posicionamento do texto.",
      exemplo:[

/* =========================================================================
   ESTADO E NAVEGAÇÃO (progresso fica só na memória da sessão)
   ========================================================================= */
const state = { completedLicoes: new Set() };

function nivelById(id){ return DATA.niveis.find(n=>n.id===id); }
function materiaById(id){ return DATA.materias.find(m=>m.id===id); }
function modulosByMateriaNivel(materiaId, nivelId){ return DATA.modulos.filter(m=>m.nivelId===nivelId && m.materiaId===materiaId); }
function licoesByModulo(id){ return DATA.licoes.filter(l=>l.moduloId===id); }
function licaoById(id){ return DATA.licoes.find(l=>l.id===id); }
function moduloById(id){ return DATA.modulos.find(m=>m.id===id); }
function licoesByMateriaNivel(materiaId, nivelId){
  const modIds = new Set(modulosByMateriaNivel(materiaId, nivelId).map(m=>m.id));
  return DATA.licoes.filter(l=>modIds.has(l.moduloId));
}
function progressoModulo(moduloId){
  const lics = licoesByModulo(moduloId);
  const done = lics.filter(l=>state.completedLicoes.has(l.id)).length;
  return { done, total: lics.length };
}
function progressoMateriaNivel(materiaId, nivelId){
  const lics = licoesByMateriaNivel(materiaId, nivelId);
  const done = lics.filter(l=>state.completedLicoes.has(l.id)).length;
  return { done, total: lics.length };
}
function normalizarTexto(s){
  return (s || "").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(",", ".");
}

function navigate(hash){ location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  const app = document.getElementById("app");

  if(parts[0] === "materia" && parts[1] && parts[2] === "nivel" && parts[3] && parts[4] === "modulo" && parts[5]){
    renderModulo(app, parts[1], parts[3], parts[5]);
  } else if(parts[0] === "materia" && parts[1] && parts[2] === "nivel" && parts[3] && parts[4] === "revisao"){
    renderRevisao(app, parts[1], parts[3]);
  } else if(parts[0] === "materia" && parts[1] && parts[2] === "nivel" && parts[3]){
    renderNivel(app, parts[1], parts[3]);
  } else if(parts[0] === "materia" && parts[1]){
    renderMateriaHub(app, parts[1]);
  } else if(parts[0] === "licao" && parts[1]){
    renderLicao(app, parts[1]);
  } else {
    renderHome(app);
  }
  window.scrollTo(0,0);
}

function renderHome(app){
  document.body.removeAttribute("data-theme");
  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand" onclick="navigate('/')"><span class="brand-dot"></span> Trilhas de Aprendizado</div>
    </div>
    <div class="hero">
      <h1>Uma trilha para cada<br>disciplina e fase da vida</h1>
      <p>Escolha a disciplina e depois a etapa de ensino — do primeiro contato até a véspera do vestibular.</p>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Buscar um assunto (ex: frações, Bhaskara, orações, redação...)">
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="portals portals-2col" id="portals-list">
      ${DATA.materias.map(m => `
        <div class="portal portal-materia portal-${m.id}" onclick="navigate('materia/${m.id}')">

      `).join("")}
    </div>

  `;

  const input = document.getElementById("search-input");
  const results = document.getElementById("search-results");
  const portalsList = document.getElementById("portals-list");

  input.addEventListener("input", () => {
    const q = normalizarTexto(input.value);
    if(q.length < 2){
      results.innerHTML = "";
      portalsList.style.display = "grid";
      return;
    }
    portalsList.style.display = "none";
    const found = DATA.licoes
      .filter(l => normalizarTexto(l.titulo + " " + l.conteudoTexto).includes(q))
      .slice(0, 8);

    if(!found.length){
      results.innerHTML = `<div class="search-empty">Nenhum assunto encontrado para "${input.value}".</div>`;
      return;
    }
    results.innerHTML = found.map(l => {
      const modulo = moduloById(l.moduloId);
      const nivel = nivelById(modulo.nivelId);
      const materia = materiaById(modulo.materiaId);
      return `

            <div class="si-path">${materia.titulo} · ${nivel.titulo} · ${modulo.titulo}</div>
          </div>
        </div>
      `;
    }).join("");
  });
}

/* ---------- GERADORES DE FIGURAS SVG (cores adaptadas ao tema ativo) ---------- */
const FIG_TEMAS = {
  ef1: { bg:"#fff8ed", grid:"rgba(61,52,139,.16)", axis:"#6b6f9e", linha:"#e0426b", destaque:"#0e7ba8", terciaria:"#0a8f5b", texto:"#3d348b", textoSuave:"#6b6f9e" },
  ef2: { bg:"#ffffff", grid:"rgba(20,20,43,.16)", axis:"#55577a", linha:"#4a4ee0", destaque:"#e0426b", terciaria:"#06915c", texto:"#14142b", textoSuave:"#55577a" },
  em:  { bg:"#151924", grid:"rgba(100,181,246,.18)", axis:"#8a93a8", linha:"#64b5f6", destaque:"#ffb74d", terciaria:"#06d6a0", texto:"#e8eaf0", textoSuave:"#8a93a8" }
};
let FIG = FIG_TEMAS.em;
function setFigTema(tema){ FIG = FIG_TEMAS[tema] || FIG_TEMAS.em; }

function fSvg(viewBox, inner){
  return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; font-family:'IBM Plex Mono',monospace;">${inner}</svg>`;
}

// eixos cartesianos com grade, retorna helpers de conversão de coordenada
function eixos(w, h, xMin, xMax, yMin, yMax){
  const px = x => ((x - xMin) / (xMax - xMin)) * w;
  const py = y => h - ((y - yMin) / (yMax - yMin)) * h;
  let grid = "";
  for(let gx = Math.ceil(xMin); gx <= xMax; gx++){ grid += `<line x1="${px(gx)}" y1="0" x2="${px(gx)}" y2="${h}" stroke="${FIG.grid}" stroke-width="1"/>`; }
  for(let gy = Math.ceil(yMin); gy <= yMax; gy++){ grid += `<line x1="0" y1="${py(gy)}" x2="${w}" y2="${py(gy)}" stroke="${FIG.grid}" stroke-width="1"/>`; }
  const axes = `<line x1="0" y1="${py(0)}" x2="${w}" y2="${py(0)}" stroke="${FIG.axis}" stroke-width="1.5"/>
                <line x1="${px(0)}" y1="0" x2="${px(0)}" y2="${h}" stroke="${FIG.axis}" stroke-width="1.5"/>`;
  return { px, py, svg: grid + axes };
}

function figuraFuncao(tipo, params){
  const w=320, h=220;
  const xMin=-6, xMax=6, yMin=-6, yMax=10;
  const { px, py, svg } = eixos(w,h,xMin,xMax,yMin,yMax);
  const f = x => {
    if(tipo==="afim") return params.a*x + params.b;
    if(tipo==="quadratica") return params.a*x*x + params.b*x + params.c;
    if(tipo==="exponencial") return Math.pow(params.a, x);
    return 0;
  };
  let pts = "";
  for(let x=xMin; x<=xMax; x+=0.25){
    const y = f(x);
    if(y < yMin-2 || y > yMax+2) continue;
    pts += `${px(x)},${py(Math.max(yMin,Math.min(yMax,y)))} `;
  }
  let marcadores = "";
  if(tipo==="quadratica"){
    const xv = -params.b/(2*params.a);
    const yv = f(xv);
    marcadores += `<circle cx="${px(xv)}" cy="${py(yv)}" r="4" fill="${FIG.destaque}"/><text x="${px(xv)+8}" y="${py(yv)-6}" fill="${FIG.destaque}" font-size="11">vértice</text>`;
    const delta = params.b*params.b - 4*params.a*params.c;
    if(delta >= 0){
      const r1 = (-params.b + Math.sqrt(delta))/(2*params.a);
      const r2 = (-params.b - Math.sqrt(delta))/(2*params.a);
      [r1,r2].forEach(r=>{ marcadores += `<circle cx="${px(r)}" cy="${py(0)}" r="3.5" fill="${FIG.linha}"/>`; });
    }
  }
  return fSvg(`0 0 ${w} ${h}`, `${svg}<polyline points="${pts}" fill="none" stroke="${FIG.linha}" stroke-width="2.5"/>${marcadores}`);
}

function figuraPlano(opts){
  const w=300, h=240;
  const xMin=opts.xMin ?? -2, xMax=opts.xMax ?? 8, yMin=opts.yMin ?? -2, yMax=opts.yMax ?? 8;

function passoFatoracao(x, y, exigirAmbos){
  for(let p=2; p<=Math.max(x,y); p++){
    const divX = x>1 && x%p===0;
    const divY = y>1 && y%p===0;
    if(exigirAmbos ? (divX && divY) : (divX || divY)) return p;
  }
  return null;
}
function escadaFatoracao(a, b, exigirAmbos){
  const passos = [];
  let x=a, y=b;
  while(exigirAmbos ? true : (x!==1 || y!==1)){
    const p = passoFatoracao(x, y, exigirAmbos);
    if(!p) break;
    passos.push({x,y,p});
    x = (x>1 && x%p===0) ? x/p : x;
    y = (y>1 && y%p===0) ? y/p : y;
    if(exigirAmbos && x===1 && y===1) break;
  }
  return passos;
}

function figuraMmcMdc(a, b){
  const passosMMC = escadaFatoracao(a, b, false);
  const passosMDC = escadaFatoracao(a, b, true);
  const mmcVal = passosMMC.reduce((acc,s)=>acc*s.p, 1);
  const mdcVal = passosMDC.reduce((acc,s)=>acc*s.p, 1);
  const rowH = 24;
  const alturaMax = Math.max(passosMMC.length, passosMDC.length);
  const h = 60 + alturaMax*rowH + 30;

  function desenhar(passos, x0, cor, label, valor){
    let g = `<text x="${x0}" y="24" fill="${cor}" font-size="14" font-weight="bold">${label}(${a},${b})</text>
              <line x1="${x0+52}" y1="34" x2="${x0+52}" y2="${34+passos.length*rowH}" stroke="${FIG.grid}" stroke-width="1"/>`;
    let y = 52;
    passos.forEach(s=>{
      g += `<text x="${x0}" y="${y}" fill="${FIG.texto}" font-size="13">${s.x} , ${s.y}</text>
            <text x="${x0+62}" y="${y}" fill="${cor}" font-size="13">${s.p}</text>`;
      y += rowH;
    });
    g += `<text x="${x0}" y="${y+10}" fill="${cor}" font-size="13" font-weight="bold">${label} = ${passos.map(s=>s.p).join('×')} = ${valor}</text>`;
    return g;
  }

  return fSvg(`0 0 320 ${h}`, `
    ${desenhar(passosMMC, 10, FIG.linha, "MMC", mmcVal)}
    ${desenhar(passosMDC, 175, FIG.destaque, "MDC", mdcVal)}
  `);
}

function expoenteUnicode(n){
  const map = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  return n.toString().split("").map(d=>map[d]).join("");
}

  let g = `<text x="20" y="24" fill="${FIG.linha}" font-size="14" font-weight="bold">primo</text>
            <text x="180" y="24" fill="${FIG.destaque}" font-size="14" font-weight="bold">composto</text>`;

  primos.forEach((n,i)=>{

  });

  compostos.forEach((n,i)=>{

function figuraFatoracaoSimples(n){
  const passos = [];
  let x = n;
  while(x !== 1){
    let p = 2;
    while(x % p !== 0) p++;
    passos.push(p);
    x = x / p;
  }
  const contagem = {};
  passos.forEach(p => contagem[p] = (contagem[p]||0) + 1);
  const fatoracaoTexto = Object.keys(contagem).sort((a,b)=>a-b)
    .map(p => contagem[p] > 1 ? `${p}${expoenteUnicode(contagem[p])}` : `${p}`)
    .join(" · ");

  const rowH = 26, h = passos.length*rowH + 60;
  let x0 = n, y = 40;
  let g = "";
  passos.forEach(p => {
    const x1 = x0 / p;
    g += `<text x="20" y="${y}" fill="${FIG.texto}" font-size="15" text-anchor="end">${x0}</text>
          <line x1="30" y1="${y-16}" x2="30" y2="${y+8}" stroke="${FIG.grid}" stroke-width="1"/>
          <text x="40" y="${y}" fill="${FIG.linha}" font-size="15">${p}</text>`;
    x0 = x1;
    y += rowH;
  });
  g += `<text x="20" y="${y}" fill="${FIG.texto}" font-size="15" text-anchor="end">1</text>`;
  g += `<text x="20" y="${y+34}" fill="${FIG.destaque}" font-size="15" font-weight="bold">${n} = ${fatoracaoTexto}</text>`;
  return fSvg(`0 0 220 ${h}`, g);
}

function figuraSomaAngulos(){
  const A=[40,150], B=[220,150], C=[110,30];
  function arco(vertice, p1, p2, raio, cor){
    const ang = (p,c) => Math.atan2(p[1]-c[1], p[0]-c[0]);
    const a1 = ang(p1, vertice), a2 = ang(p2, vertice);
    const x1 = vertice[0]+raio*Math.cos(a1), y1 = vertice[1]+raio*Math.sin(a1);
    const x2 = vertice[0]+raio*Math.cos(a2), y2 = vertice[1]+raio*Math.sin(a2);
    return `<path d="M${x1},${y1} A${raio},${raio} 0 0 1 ${x2},${y2}" fill="none" stroke="${cor}" stroke-width="2"/>`;
  }
  return fSvg("0 0 260 210", `
    <polygon points="${A.join(',')} ${B.join(',')} ${C.join(',')}" fill="rgba(100,181,246,.08)" stroke="${FIG.linha}" stroke-width="2.5"/>
    ${arco(A,B,C,22,FIG.destaque)}
    ${arco(B,A,C,22,FIG.destaque)}
    ${arco(C,A,B,18,FIG.destaque)}
    <text x="${A[0]-6}" y="${A[1]+22}" fill="${FIG.destaque}" font-size="13">α</text>
    <text x="${B[0]-8}" y="${B[1]+22}" fill="${FIG.destaque}" font-size="13">β</text>
    <text x="${C[0]-4}" y="${C[1]-10}" fill="${FIG.destaque}" font-size="13">γ</text>
    <text x="70" y="195" fill="${FIG.texto}" font-size="14" font-weight="bold">α + β + γ = 180°</text>
  `);
}

function figuraPitagoras(oposto, adjacente){
  const escala = 24, margin = 20;
  const hip = Math.sqrt(oposto*oposto + adjacente*adjacente);
  const qOp = oposto*escala, qAdj = adjacente*escala;
  const w = qAdj + qOp + margin*2 + 30;
  const h = qOp + qAdj + margin*2 + 30;
  const ox = margin + qOp, oy = h - margin - qOp;
  const ax = ox, ay = oy - oposto*escala;
  const bx = ox + adjacente*escala, by = oy;
  return fSvg(`0 0 ${w} ${h}`, `
    <rect x="${ox-qOp}" y="${ay-qOp}" width="${qOp}" height="${qOp}" fill="rgba(100,181,246,.14)" stroke="${FIG.linha}" stroke-width="1.5"/>
    <text x="${ox-qOp/2}" y="${ay-qOp/2+5}" fill="${FIG.linha}" font-size="13" text-anchor="middle">${oposto}²</text>
    <rect x="${ox}" y="${by}" width="${qAdj}" height="${qAdj}" fill="rgba(100,181,246,.14)" stroke="${FIG.linha}" stroke-width="1.5"/>
    <text x="${ox+qAdj/2}" y="${by+qAdj/2+5}" fill="${FIG.linha}" font-size="13" text-anchor="middle">${adjacente}²</text>
    <polygon points="${ox},${oy} ${ax},${ay} ${bx},${by}" fill="rgba(255,183,77,.1)" stroke="${FIG.destaque}" stroke-width="2.5"/>
    <rect x="${ox}" y="${oy-14}" width="14" height="14" fill="none" stroke="${FIG.axis}" stroke-width="1.3"/>
    <text x="${(ax+bx)/2+10}" y="${(ay+by)/2-8}" fill="${FIG.destaque}" font-size="13">${Math.round(hip*100)/100}²</text>
  `);
}

function figuraRetanguloArea(base, altura){
  const escala = 30, margin = 40;
  const w = base*escala + margin*2, h = altura*escala + margin*2;
  return fSvg(`0 0 ${w} ${h}`, `
    <rect x="${margin}" y="${margin}" width="${base*escala}" height="${altura*escala}" fill="rgba(100,181,246,.14)" stroke="${FIG.linha}" stroke-width="2.5"/>
    <text x="${margin+base*escala/2}" y="${h-14}" fill="${FIG.texto}" font-size="13" text-anchor="middle">base=${base}</text>
    <text x="${margin+base*escala+10}" y="${margin+altura*escala/2+4}" fill="${FIG.texto}" font-size="13">altura=${altura}</text>
    <text x="${margin+base*escala/2}" y="${margin+altura*escala/2+5}" fill="${FIG.destaque}" font-size="14" text-anchor="middle" font-weight="bold">A=${base*altura}</text>
  `);
}

function figuraTrianguloCirculoArea(baseT, alturaT, raioC){
  const escala = 16, margin = 20;
  const areaT = (baseT*alturaT)/2, areaC = Math.round(Math.PI*raioC*raioC*100)/100;
  const w = 300, h = 140;
  const tx0=40, ty0=110, txAlt=tx0+baseT*escala/2, tyAlt=ty0-alturaT*escala;
  const txDir=tx0+baseT*escala;
  const cx=220, cy=80, r=raioC*escala;
  return fSvg(`0 0 ${w} ${h}`, `
    <polygon points="${tx0},${ty0} ${txDir},${ty0} ${txAlt},${tyAlt}" fill="rgba(100,181,246,.1)" stroke="${FIG.linha}" stroke-width="2"/>
    <line x1="${txAlt}" y1="${tyAlt}" x2="${txAlt}" y2="${ty0}" stroke="${FIG.destaque}" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="${tx0}" y="${ty0+18}" fill="${FIG.texto}" font-size="11">b=${baseT}</text>
    <text x="${txAlt+4}" y="${(tyAlt+ty0)/2}" fill="${FIG.destaque}" font-size="11">h=${alturaT}</text>
    <text x="${tx0}" y="${ty0+34}" fill="${FIG.linha}" font-size="12" font-weight="bold">A=${areaT}</text>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(255,183,77,.1)" stroke="${FIG.destaque}" stroke-width="2"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${FIG.destaque}" stroke-width="1.5"/>
    <text x="${cx+r/2-4}" y="${cy-6}" fill="${FIG.texto}" font-size="11">r=${raioC}</text>
    <text x="${cx-20}" y="${cy+r+22}" fill="${FIG.destaque}" font-size="12" font-weight="bold">A≈${areaC}</text>
  `);
}

function figuraLinhaSetor(){
  const w=320, h=150;
  const linhaPts = [[20,90],[70,60],[120,70],[170,30]].map(p=>p.join(",")).join(" ");
  const setores = [
    { pct:50, cor:FIG.linha },
    { pct:30, cor:FIG.destaque },
    { pct:20, cor:"#06d6a0" }
  ];
  const cx=250, cy=80, r=45;
  let anguloAtual = -90, fatias = "";
  setores.forEach(s => {
    const anguloFatia = (s.pct/100)*360;
    const a1 = anguloAtual*Math.PI/180, a2 = (anguloAtual+anguloFatia)*Math.PI/180;
    const x1 = cx+r*Math.cos(a1), y1 = cy+r*Math.sin(a1);
    const x2 = cx+r*Math.cos(a2), y2 = cy+r*Math.sin(a2);
    const largeArc = anguloFatia > 180 ? 1 : 0;
    fatias += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${s.cor}" opacity=".8"/>`;
    anguloAtual += anguloFatia;
  });
  return fSvg(`0 0 ${w} ${h}`, `
    <text x="20" y="18" fill="${FIG.texto}" font-size="12" font-weight="bold">gráfico de linha</text>
    <line x1="15" y1="105" x2="185" y2="105" stroke="${FIG.axis}" stroke-width="1.2"/>
    <polyline points="${linhaPts}" fill="none" stroke="${FIG.linha}" stroke-width="2.5"/>
    ${[[20,90],[70,60],[120,70],[170,30]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${FIG.linha}"/>`).join("")}
    <text x="210" y="18" fill="${FIG.texto}" font-size="12" font-weight="bold">gráfico de setores</text>
    ${fatias}
    <text x="${cx-40}" y="${h-8}" fill="${FIG.linha}" font-size="11">■ 50%</text>
    <text x="${cx}" y="${h-8}" fill="${FIG.destaque}" font-size="11">■ 30%</text>
    <text x="${cx+40}" y="${h-8}" fill="#06d6a0" font-size="11">■ 20%</text>
  `);
}

function figuraBlocosPosicional(p){
  const centenas=p.centenas||0, dezenas=p.dezenas||0, unidades=p.unidades||0;
  const y=20; let x=14, g="";
  for(let i=0;i<centenas;i++){
    g += `<rect x="${x}" y="${y}" width="36" height="36" rx="4" fill="${FIG.linha}" opacity=".2" stroke="${FIG.linha}" stroke-width="2.2"/>`;
    x += 46;
  }
  if(centenas) x += 10;
  for(let i=0;i<dezenas;i++){
    g += `<rect x="${x}" y="${y}" width="8" height="36" rx="2" fill="${FIG.destaque}" opacity=".8" stroke="${FIG.destaque}" stroke-width="1.4"/>`;
    x += 13;
  }
  if(dezenas) x += 10;
  let ux=x, uy=y+24, count=0;
  for(let i=0;i<unidades;i++){
    g += `<rect x="${ux}" y="${uy}" width="10" height="10" rx="2" fill="${FIG.terciaria}" opacity=".85" stroke="${FIG.terciaria}" stroke-width="1.2"/>`;
    count++; ux+=14;
    if(count%5===0){ ux=x; uy+=14; }
  }
  const w = Math.max(x+5*14+30, 220);
  const h = y+36+50;
  const legenda = (centenas?centenas+' centena(s) + ':'') + dezenas+' dezena(s) + '+unidades+' unidade(s)';
  return fSvg(`0 0 ${w} ${h}`, g + `<text x="14" y="${h-12}" fill="${FIG.texto}" font-size="12">${legenda}</text>`);
}

function figuraComparar(a,b){
  const simbolo = a>b ? '>' : (a<b ? '<' : '=');
  return fSvg("0 0 260 130", `
    <rect x="20" y="25" width="80" height="80" rx="16" fill="${FIG.linha}" opacity=".15" stroke="${FIG.linha}" stroke-width="2.5"/>
    <text x="60" y="78" fill="${FIG.linha}" font-size="30" text-anchor="middle" font-weight="bold">${a}</text>
    <text x="130" y="78" fill="${FIG.texto}" font-size="28" text-anchor="middle" font-weight="bold">${simbolo}</text>
    <rect x="160" y="25" width="80" height="80" rx="16" fill="${FIG.destaque}" opacity=".15" stroke="${FIG.destaque}" stroke-width="2.5"/>
    <text x="200" y="78" fill="${FIG.destaque}" font-size="30" text-anchor="middle" font-weight="bold">${b}</text>
  `);
}

function figuraContagem(tipo, a, b){
  let g="", x=20;
  if(tipo === "soma"){
    for(let i=0;i<a;i++){ g += `<circle cx="${x}" cy="35" r="7" fill="${FIG.linha}" opacity=".85"/>`; x+=18; }
    for(let i=0;i<b;i++){ g += `<circle cx="${x}" cy="35" r="7" fill="${FIG.destaque}" opacity=".85"/>`; x+=18; }
    g += `<text x="20" y="72" fill="${FIG.texto}" font-size="14" font-weight="bold">${a} + ${b} = ${a+b}</text>`;
  } else {
    for(let i=0;i<a;i++){
      const removido = i >= (a-b);
      g += `<circle cx="${x}" cy="35" r="7" fill="${FIG.linha}" opacity="${removido?0.25:0.9}"/>`;
      if(removido){ g += `<line x1="${x-7}" y1="28" x2="${x+7}" y2="42" stroke="${FIG.destaque}" stroke-width="2.2"/>`; }
      x += 18;
    }
    g += `<text x="20" y="72" fill="${FIG.texto}" font-size="14" font-weight="bold">${a} - ${b} = ${a-b}</text>`;
  }
  return fSvg(`0 0 ${Math.max(260, x+20)} 90`, g);
}

function figuraGruposIguais(grupos, porGrupo){
  const w = grupos*70+20, h=110;
  const cores=[FIG.linha, FIG.destaque, FIG.terciaria];
  let g="";
  for(let gi=0; gi<grupos; gi++){
    const gx = 20+gi*70;
    for(let i=0;i<porGrupo;i++){
      const col=i%3, row=Math.floor(i/3);
      g += `<circle cx="${gx+col*16}" cy="${30+row*16}" r="6" fill="${cores[gi%cores.length]}" opacity=".85"/>`;
    }
    g += `<rect x="${gx-6}" y="20" width="52" height="${Math.ceil(porGrupo/3)*16+10}" rx="6" fill="none" stroke="${FIG.axis}" stroke-width="1.3" stroke-dasharray="3,3"/>`;
  }
  g += `<text x="20" y="${h-14}" fill="${FIG.texto}" font-size="13" font-weight="bold">${grupos} grupos de ${porGrupo} = ${grupos*porGrupo}</text>`;
  return fSvg(`0 0 ${w} ${h}`, g);
}

function figuraPizza(partes, pintadas){
  const cx=80, cy=75, r=62;
  let g="";
  for(let i=0;i<partes;i++){
    const a1=(i/partes)*2*Math.PI-Math.PI/2, a2=((i+1)/partes)*2*Math.PI-Math.PI/2;
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const large = (a2-a1) > Math.PI ? 1 : 0;
    const cor = i < pintadas ? FIG.linha : "none";
    g += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${cor}" opacity=".8" stroke="${FIG.texto}" stroke-width="1.6"/>`;
  }
  return fSvg("0 0 160 170", g + `<text x="80" y="158" fill="${FIG.texto}" font-size="14" text-anchor="middle" font-weight="bold">${pintadas}/${partes}</text>`);
}

function figuraBarraFracao(partes, pintadas, rotulo){
  const w=240, h=76, barW=200, barH=40, x0=20, y0=15;
  const cellW = barW/partes;
  let g="";
  for(let i=0;i<partes;i++){
    g += `<rect x="${x0+i*cellW}" y="${y0}" width="${cellW}" height="${barH}" fill="${i<pintadas?FIG.linha:'none'}" opacity=".8" stroke="${FIG.texto}" stroke-width="1.6"/>`;
  }
  return fSvg(`0 0 ${w} ${h}`, g + `<text x="${x0}" y="${y0+barH+22}" fill="${FIG.texto}" font-size="13">${rotulo}</text>`);
}

function figuraCompararFracoes(lista){
  const w=260, h=155;
  let g="";
  lista.forEach((fr,i)=>{
    const [num,den] = fr;
    const cx=70+i*130, cy=58, r=45;
    for(let k=0;k<den;k++){
      const a1=(k/den)*2*Math.PI-Math.PI/2, a2=((k+1)/den)*2*Math.PI-Math.PI/2;
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      const large=(a2-a1)>Math.PI?1:0;
      const cor = k<num ? (i===0?FIG.linha:FIG.destaque) : "none";
      g += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${cor}" opacity=".8" stroke="${FIG.texto}" stroke-width="1.4"/>`;
    }
    g += `<text x="${cx}" y="128" fill="${FIG.texto}" font-size="14" text-anchor="middle" font-weight="bold">${num}/${den}</text>`;
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function iconeFormaPlana(tipo, cor){
  switch(tipo){
    case "quadrado": return `<rect x="-18" y="-18" width="36" height="36" rx="4" fill="${cor}" opacity=".22" stroke="${cor}" stroke-width="3"/>`;
    case "retangulo": return `<rect x="-24" y="-14" width="48" height="28" rx="4" fill="${cor}" opacity=".22" stroke="${cor}" stroke-width="3"/>`;
    case "circulo": return `<circle cx="0" cy="0" r="20" fill="${cor}" opacity=".22" stroke="${cor}" stroke-width="3"/>`;
    case "triangulo": return `<polygon points="0,-22 -20,16 20,16" fill="${cor}" opacity=".22" stroke="${cor}" stroke-width="3"/>`;
    default: return "";
  }
}

function figuraFormasPlanas(lista){
  const cores=[FIG.linha, FIG.destaque, FIG.terciaria, FIG.linha];
  const w = lista.length*100+20, h=110;
  let g="";
  lista.forEach((tipo,i)=>{
    const cx = 60+i*100;
    g += `<g transform="translate(${cx},48)">${iconeFormaPlana(tipo,cores[i%cores.length])}</g>
          <text x="${cx}" y="95" fill="${FIG.texto}" font-size="13" text-anchor="middle">${tipo}</text>`;
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function figuraRelogio(hora, minuto){
  const cx=80, cy=80, r=62;
  const anguloMin = (minuto/60)*360 - 90;
  const anguloHora = ((hora%12)/12)*360 + (minuto/60)*30 - 90;
  const ponteiro = (ang,comp,cor,largura) => {
    const rad = ang*Math.PI/180;
    const x = cx+comp*Math.cos(rad), y = cy+comp*Math.sin(rad);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${cor}" stroke-width="${largura}" stroke-linecap="round"/>`;
  };
  let marcas = "";
  for(let i=0;i<12;i++){
    const ang = i*30*Math.PI/180 - Math.PI/2;
    const x1=cx+(r-8)*Math.cos(ang), y1=cy+(r-8)*Math.sin(ang);
    const x2=cx+r*Math.cos(ang), y2=cy+r*Math.sin(ang);
    marcas += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${FIG.axis}" stroke-width="2"/>`;
  }
  return fSvg("0 0 160 170", `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${FIG.texto}" stroke-width="3"/>
    ${marcas}
    ${ponteiro(anguloHora, 32, FIG.texto, 5)}
    ${ponteiro(anguloMin, 48, FIG.linha, 3.5)}
    <circle cx="${cx}" cy="${cy}" r="4" fill="${FIG.destaque}"/>
    <text x="${cx}" y="${cy+r+24}" fill="${FIG.texto}" font-size="14" text-anchor="middle" font-weight="bold">${String(hora).padStart(2,'0')}:${String(minuto).padStart(2,'0')}</text>
  `);
}

function figuraComparaMedidas(itens){
  const max = Math.max(...itens.map(i=>i.valor));
  const barMax=150, rowH=40, w=290;
  const h = itens.length*rowH+20;
  const cores=[FIG.linha, FIG.destaque, FIG.terciaria];
  let g="";
  itens.forEach((it,i)=>{
    const y=20+i*rowH;
    const largura = (it.valor/max)*barMax;
    g += `<text x="10" y="${y+14}" fill="${FIG.texto}" font-size="12">${it.label}</text>
          <rect x="100" y="${y}" width="${largura}" height="18" rx="4" fill="${cores[i%cores.length]}" opacity=".8"/>
          <text x="${100+largura+8}" y="${y+14}" fill="${FIG.texto}" font-size="12" font-weight="bold">${it.valor}${it.unidade}</text>`;
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function figuraTabela(cabecalho, linhas){
  const rowH=26, w=240, h=(linhas.length+1)*rowH+20;
  let g = `<line x1="10" y1="${rowH+14}" x2="${w-10}" y2="${rowH+14}" stroke="${FIG.axis}" stroke-width="1.3"/>
           <text x="20" y="24" fill="${FIG.texto}" font-size="13" font-weight="bold">${cabecalho[0]}</text>
           <text x="150" y="24" fill="${FIG.texto}" font-size="13" font-weight="bold">${cabecalho[1]}</text>`;
  linhas.forEach((l,i)=>{
    const y = 24+(i+1)*rowH;
    g += `<text x="20" y="${y}" fill="${FIG.textoSuave}" font-size="13">${l[0]}</text>
          <text x="150" y="${y}" fill="${FIG.linha}" font-size="13" font-weight="bold">${l[1]}</text>`;
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function figuraBarrasNomeadas(itens){
  const w = itens.length*70+20, h=170;
  const max = Math.max(...itens.map(i=>i.valor));
  const cores=[FIG.linha, FIG.destaque, FIG.terciaria];
  let g = `<line x1="10" y1="130" x2="${w-10}" y2="130" stroke="${FIG.axis}" stroke-width="1.3"/>`;
  itens.forEach((it,i)=>{
    const altura = (it.valor/max)*90;
    const x = 20+i*70;
    g += `<rect x="${x}" y="${130-altura}" width="40" height="${altura}" rx="4" fill="${cores[i%cores.length]}" opacity=".85"/>
          <text x="${x+20}" y="145" fill="${FIG.texto}" font-size="12" text-anchor="middle">${it.nome}</text>
          <text x="${x+20}" y="${130-altura-8}" fill="${FIG.texto}" font-size="12" text-anchor="middle" font-weight="bold">${it.valor}</text>`;
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function figuraPictograma(itens){
  const rowH=34, w=280, h=itens.length*rowH+20;
  let g="";
  itens.forEach((it,i)=>{
    const y=24+i*rowH;
    g += `<text x="10" y="${y+5}" fill="${FIG.texto}" font-size="12">${it.nome}</text>`;
    let x=110;
    for(let k=0;k<it.qtd;k++){
      g += `<circle cx="${x}" cy="${y}" r="6" fill="${FIG.linha}" opacity=".85"/>`;
      x += 16;
    }
  });
  return fSvg(`0 0 ${w} ${h}`, g);
}

function gerarFigura(fig){
  if(!fig) return "";
  switch(fig.tipo){
    case "funcao": return figuraFuncao(fig.sub, fig.params);
    case "plano": return figuraPlano(fig.params);
    case "triangulo": return figuraTriangulo(fig.params);
    case "ciclo": return figuraCiclo(fig.params.angulo);
    case "sequencia": return figuraSequencia(fig.params.termos, fig.params.cor);
    case "matriz": return figuraMatriz(fig.params.matriz);
    case "solidos": return figuraSolidos(fig.params.lista);
    case "planificacao-cubo": return figuraPlanificacaoCubo();
    case "combinatoria": return figuraCombinatoria(fig.sub, fig.params.elementos);
    case "estatistica": return figuraEstatistica(fig.sub, fig.params);
    case "regra-de-tres": return figuraRegraDeTres(fig.params);
    case "mmc-mdc": return figuraMmcMdc(fig.params.a, fig.params.b);
    case "fatoracao-simples": return figuraFatoracaoSimples(fig.params.n);
    case "primos-compostos": return figuraPrimosCompostos();
    case "soma-angulos": return figuraSomaAngulos();
    case "pitagoras": return figuraPitagoras(fig.params.oposto, fig.params.adjacente);
    case "retangulo-area": return figuraRetanguloArea(fig.params.base, fig.params.altura);
    case "triangulo-circulo-area": return figuraTrianguloCirculoArea(fig.params.baseT, fig.params.alturaT, fig.params.raioC);
    case "linha-setor": return figuraLinhaSetor();
    case "blocos-posicional": return figuraBlocosPosicional(fig.params);
    case "comparar": return figuraComparar(fig.params.a, fig.params.b);
    case "contagem": return figuraContagem(fig.sub, fig.params.a, fig.params.b);
    case "grupos-iguais": return figuraGruposIguais(fig.params.grupos, fig.params.porGrupo);
    case "pizza": return figuraPizza(fig.params.partes, fig.params.pintadas);
    case "barra-fracao": return figuraBarraFracao(fig.params.partes, fig.params.pintadas, fig.params.rotulo);
    case "comparar-fracoes": return figuraCompararFracoes(fig.params.lista);
    case "formas-planas": return figuraFormasPlanas(fig.params.lista);
    case "relogio": return figuraRelogio(fig.params.hora, fig.params.minuto);
    case "compara-medidas": return figuraComparaMedidas(fig.params.itens);
    case "tabela": return figuraTabela(fig.params.cabecalho, fig.params.linhas);
    case "barras-nomeadas": return figuraBarrasNomeadas(fig.params.itens);
    case "pictograma": return figuraPictograma(fig.params.itens);
    default: return "";
  }
}

/* ---------- MOTOR DE QUIZ (genérico — usado na lição e na revisão) ---------- */
function runQuiz(mount, perguntas, callbacks){
  let idx = 0;
  let acertos = 0;
  const onEach = (callbacks && callbacks.onEach) || function(){};
  const onComplete = (callbacks && callbacks.onComplete) || function(){};

  function draw(){
    if(idx >= perguntas.length){
      onComplete(acertos, perguntas.length);
      return;
    }
    const q = perguntas[idx];
    const isAberta = q.tipo === "aberta";

    mount.innerHTML = `
      <div class="quiz-card">
        ${isAberta ? '<div class="quiz-tag-aberta">✏️ resposta aberta</div>' : ''}
        ${q.dificuldade === 'dificil' ? '<div class="quiz-tag-desafio">🔥 desafio</div>' : ''}
        <div class="quiz-q">${q.pergunta}</div>
        ${isAberta
          ? `<div class="quiz-input-row">
               <input type="text" class="quiz-input" id="quiz-aberta-input" placeholder="Digite sua resposta" autocomplete="off">
               <button class="btn-primary" id="quiz-aberta-confirmar">Confirmar</button>
             </div>`
          : q.opcoes.map((op,i) => `<button class="quiz-opt" data-i="${i}">${op}</button>`).join("")}
        <div class="quiz-feedback" id="quiz-feedback"></div>
        <div class="quiz-progress">
          ${perguntas.map((_,i)=>`<div class="quiz-dot ${i<idx?'done':''}"></div>`).join("")}
        </div>
      </div>
    `;

    function afterAnswer(correct){
      if(correct) acertos++;
      onEach(idx, correct, q);
      const fb = document.getElementById("quiz-feedback");
      fb.textContent = (correct ? "Isso mesmo! " : "Quase — ") + q.explicacao;
      fb.classList.add("show");

      const nextBtn = document.createElement("button");
      nextBtn.className = "btn-primary";
      nextBtn.style.marginTop = "14px";
      nextBtn.textContent = idx === perguntas.length - 1 ? "Ver resultado" : "Próxima pergunta →";
      nextBtn.onclick = () => { idx++; draw(); };
      mount.querySelector(".quiz-card").appendChild(nextBtn);
    }

    if(isAberta){
      const input = document.getElementById("quiz-aberta-input");
      const confirmar = document.getElementById("quiz-aberta-confirmar");
      const submit = () => {
        confirmar.disabled = true;
        input.disabled = true;
        const valor = normalizarTexto(input.value);
        const correct = q.resposta.some(r => normalizarTexto(r) === valor);
        afterAnswer(correct);
      };
      confirmar.addEventListener("click", submit, { once:true });
      input.addEventListener("keydown", e => { if(e.key === "Enter"){ submit(); } }, { once:true });
    } else {
      mount.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const chosen = parseInt(btn.dataset.i, 10);
          const correct = chosen === q.correta;
          mount.querySelectorAll(".quiz-opt").forEach(b => {
            b.disabled = true;
            const bi = parseInt(b.dataset.i, 10);
            if(bi === q.correta) b.classList.add("correct");
            else if(bi === chosen) b.classList.add("wrong");
          });
          afterAnswer(correct);
        }, { once:true });
      });
    }
  }
  draw();
}

/* ---------- QUIZ DE UMA LIÇÃO ---------- */
function mountQuiz(licao){
  const mount = document.getElementById("quiz-mount");
  runQuiz(mount, licao.quiz, {
    onComplete: (acertos, total) => {
      state.completedLicoes.add(licao.id);
      mount.innerHTML = `
        <div class="quiz-done">
          <div class="big">${acertos === total ? '🏆' : '✅'}</div>
          <h4 style="margin-top:8px;">Você acertou ${acertos} de ${total}</h4>
          <p style="opacity:.7; margin-top:6px; font-size:.9rem;">${acertos === total ? 'Mandou muito bem! Lição concluída.' : 'Lição concluída — continue praticando.'}</p>
        </div>
      `;
    }
  });
}

/* ---------- REVISÃO RÁPIDA ---------- */
function renderRevisao(app, materiaId, nivelId){
  const nivel = nivelById(nivelId);
  const materia = materiaById(materiaId);
  if(!nivel || !materia){ renderHome(app); return; }
  document.body.setAttribute("data-theme", nivel.tema);

  // junta perguntas de todas as lições da trilha (dentro da mesma disciplina), guardando de qual lição vieram
  let banco = [];
  licoesByMateriaNivel(materiaId, nivelId).forEach(l => {
    l.quiz.forEach(q => banco.push({ ...q, licaoId:l.id, licaoTitulo:l.titulo }));
  });
  // embaralha e escolhe até 8 perguntas
  for(let i = banco.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [banco[i], banco[j]] = [banco[j], banco[i]];
  }
  const perguntas = banco.slice(0, Math.min(8, banco.length));
  const erradas = [];

  app.innerHTML = `
    <div class="topbar wrap">
      <div class="brand" onclick="navigate('/')"><span class="brand-dot"></span> Trilhas de Aprendizado</div>
      <div class="crumbs"><a onclick="navigate('materia/${materiaId}/nivel/${nivelId}')">← ${nivel.titulo}</a></div>
    </div>
    <div class="page wrap">
      <div class="licao-body">
        <div class="level-tag">${materia.titulo} · ${nivel.titulo}</div>
        <h1 style="margin-top:6px;">⚡ Revisão rápida</h1>
        <div class="revisao-intro">
          <p style="opacity:.85; line-height:1.5;">Uma mistura de ${perguntas.length} perguntas de vários módulos desta trilha, pra testar o que você já sabe antes de uma prova.</p>
        </div>
        <div class="licao-section">
          <div id="revisao-mount"></div>
        </div>
      </div>
    </div>
  `;

  if(!perguntas.length){
    document.getElementById("revisao-mount").innerHTML = `<p style="opacity:.7;">Ainda não há perguntas suficientes nesta trilha.</p>`;
    return;
  }

  const mount = document.getElementById("revisao-mount");
  runQuiz(mount, perguntas, {
    onEach: (idx, correct, q) => { if(!correct) erradas.push(q); },
    onComplete: (acertos, total) => {
      mount.innerHTML = `
        <div class="quiz-done">
          <div class="big">${acertos === total ? '🏆' : '📚'}</div>
          <h4 style="margin-top:8px;">Você acertou ${acertos} de ${total}</h4>
        </div>
        ${erradas.length ? `
          <div style="margin-top:18px;">
            <h3 style="font-size:.85rem; text-transform:uppercase; letter-spacing:.07em; opacity:.65; margin-bottom:6px;">Vale revisar</h3>
            ${[...new Map(erradas.map(e=>[e.licaoId,e])).values()].map(e => `
              <div class="revisao-summary-item mod-card" onclick="navigate('licao/${e.licaoId}')">
                <span>📖</span><span>${e.licaoTitulo}</span>
              </div>
            `).join("")}
          </div>
        ` : ""}
      `;
    }
  });
}
</script>
